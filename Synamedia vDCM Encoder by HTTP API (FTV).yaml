        - uuid: 846dacb4e32547038a7290ab5000ba9f
          name: 'vDCM device health status'
          type: DEPENDENT
          key: vdcm.device.status
          history: 1h
          value_type: TEXT
          description: 'Logs into vDCM (61.220.40.194) and queries /load_alarm_footer. Returns JSON: {"alarm_count":0,"device_state":"Active - Role: Standalone","vdcm_state":"Active"}.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.device_status
          master_item:
            key: vdcm.data
          triggers:
            - uuid: f43635bfa2eb4e81b5b664e4082cfd65
              expression: 'nodata(/Synamedia vDCM Encoder by HTTP API - FTV/vdcm.device.status,6m)=1'
              name: 'vDCM: device unreachable (no data for 6 min)'
              priority: HIGH
              description: 'vDCM at 61.220.40.194:4431 has not returned data for 6+ minutes (3 consecutive poll failures). Check network and vDCM service.'
        - uuid: eb7f88d83d1e4f47945178ee7153be7e
          name: 'vDCM state'
          type: DEPENDENT
          key: vdcm.device.vdcm_state
          history: 90d
          value_type: TEXT
          description: 'vDCM operational state string (e.g. "Active"). Sourced from /load_alarm_footer vdcm_state element.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.vdcm_state
          master_item:
            key: vdcm.device.status
          triggers:
            - uuid: 2c1abf8aac0749feaba57a8365e097f1
              expression: 'last(/Synamedia vDCM Encoder by HTTP API - FTV/vdcm.device.vdcm_state)<>"Active" and last(/Synamedia vDCM Encoder by HTTP API - FTV/vdcm.device.vdcm_state)<>"unknown"'
              name: 'vDCM: state is not Active (current: {ITEM.LASTVALUE})'
              priority: HIGH
              description: 'The vDCM state is not "Active" (current: {ITEM.LASTVALUE}). Device may be in fault, standby, or restarting.'
        - uuid: c3db63d91ef04c4fafe741ecacaeb47d
          name: 'vDCM total processing bitrate'
          type: DEPENDENT
          key: vdcm.proc.bitrate
          history: 90d
          units: bps
          description: 'Total output bitrate across all encoding services from /bitrates/processing (EBC+TVBS+FTV+EBCF). Normal ~39.6 Mbps.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.proc_bps
          master_item:
            key: vdcm.data
          triggers:
            - uuid: 5a13e819d4864f8db6719835b2ac8f4e
              expression: 'min(/Synamedia vDCM Encoder by HTTP API - FTV/vdcm.proc.bitrate,3m)<{$VIDEO.PROC.BITRATE.WARN} and min(/Synamedia vDCM Encoder by HTTP API - FTV/vdcm.proc.bitrate,3m)>0'
              name: 'vDCM: total output bitrate dropped below threshold ({ITEM.LASTVALUE})'
              priority: HIGH
              description: 'Total processing bitrate dropped below {$VIDEO.PROC.BITRATE.WARN} bps for 3+ minutes. Normal total is ~39.6 Mbps. Threshold {$VIDEO.PROC.BITRATE.WARN} = 30 Mbps (~75%).'
        - uuid: 7c8d9e0f1a2b4819a77c8d9e0f1a2b48
          name: 'vDCM processing alarms (HTTP API)'
          type: DEPENDENT
          key: vdcm.processing.alarms
          history: 90d
          value_type: TEXT
          description: 'Queries /status/processing/get_rows for Board 2 (vMFP 2, xID T_I:2:4) where SDI inputs (Kona4 SDI1-SDI4) are processed for EBC/EBCF/FTV/TVBS. Returns "OK" when no processing alarms. Returns channel name + alarm type, e.g. "EBC: TS Sync Loss" when faults exist.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.processing_alarms
          master_item:
            key: vdcm.data
          triggers:
            - uuid: 6d7e8f9a0b1c4819866d7e8f9a0b1c48
              expression: 'last(/Synamedia vDCM Encoder by HTTP API - FTV/vdcm.processing.alarms)<>"OK"'
              name: 'vDCM: processing fault — {ITEM.LASTVALUE}'
              priority: HIGH
              description: 'Processing-layer fault on FTV vDCM (61.220.40.194). Affected channels: {ITEM.LASTVALUE} Source: /status/processing/get_rows for T_I:2:4 (vMFP 2 SDI inputs). Services: EBC / EBCF / FTV / TVBS (SDI1-SDI4 via Kona4 card). Investigate at https://61.220.40.194:4431 → Status > Processing.'
        - uuid: 3a4b5c6d7e8f4819a93a4b5c6d7e8f90
          name: 'vDCM SDI input signal status'
          type: DEPENDENT
          key: vdcm.sdi.status
          history: 1h
          value_type: TEXT
          description: 'Queries each SDI stream node via opennode2 to detect signal presence. Returns JSON: [{"name":"SDI1","port":"T_I:2:0:*:512","service":"EBC","signal":1},...] signal=1 = SDI input active (_128d flag on this device; _129d on SPORTCAST — both are checked). signal=0 = no signal or no service assigned. SDI nodes from macro {$VDCM.SDI.NODES}. Set macro to empty to disable. LiTV_FTV_SRT: SDI1=EBC, SDI2=TVBS, SDI3=FTV, SDI4=EBCF.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.sdi_status
          master_item:
            key: vdcm.data
        - uuid: dfdddd9c7c7445df9536d621d708290f
          name: 'vDCM all service bitrates (HTTP API)'
          type: DEPENDENT
          key: vdcm.services.bitrates
          history: 1h
          value_type: TEXT
          description: 'Logs into vDCM and queries /bitrates/processing for the processing node ({$VDCM.PROC.NODE} = T_T:2:*:*:e0). FTV returns 4 service-level rows directly (EBC/TVBS/FTV/EBCF, no profile sub-rows). Returns: {"proc_bps":39600000,"services":[{"name":"EBC","bps":9841000},...]}. Normal total ~39.6 Mbps (EBC+TVBS+FTV+EBCF each ~9.8-9.9 Mbps).'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.services_bitrates
          master_item:
            key: vdcm.data
        - uuid: 60fb670da1204cbd9b06e8e8dc8e3e7e
          name: 'vDCM active encoding service count'
          type: DEPENDENT
          key: vdcm.services.count
          history: 90d
          description: 'Number of encoding services actively returning bitrate from /bitrates/processing. Expected: 4 (EBC/TVBS/FTV/EBCF).'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var obj = JSON.parse(value);
                  var svcs = obj.services || obj;
                  return String(svcs.length);
          master_item:
            key: vdcm.services.bitrates
        - uuid: 444b263389404f039ff040aef631707f
          name: 'vDCM SRT connected stream count'
          type: DEPENDENT
          key: vdcm.srt.connected
          history: 90d
          description: 'Number of SRT streams with an active caller connection (ON=true + Caller IP present). Expected: {$VDCM.SRT.COUNT.MIN} = 8. Detects SRT caller disconnection immediately at next 2-minute poll, before bitrate drops to zero. Source: opennode2 stream title contains "ON" keyword and "Caller" IP.'
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var obj = JSON.parse(value);
                  var n = 0;
                  (obj.streams || []).forEach(function(s) { if (s.on === 1) n++; });
                  return String(n);
          master_item:
            key: vdcm.srt.output
        - uuid: 5e6483d849b34dd5884f81b919e87656
          name: 'vDCM SRT output stream count'
          type: DEPENDENT
          key: vdcm.srt.count
          history: 90d
          description: 'Number of active SRT output streams on Port 3 Mgmt (T_O:1:2). Expected: {$VDCM.SRT.COUNT.MIN} = 8 (EBC×2 + TVBS×2 + FTV×2 + EBCF×2 to both 218.211.161.8 and 211.21.3.210).'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.count
          master_item:
            key: vdcm.srt.output
        - uuid: 6df3406c2cd84a89b3b690bb1652c9a6
          name: 'vDCM SRT output stream bitrates (HTTP API)'
          type: DEPENDENT
          key: vdcm.srt.output
          history: 1h
          value_type: TEXT
          description: 'Queries /bitrates/output for {$VDCM.OUTPUT.CARD} (T_O:1:2 = Port 3 Mgmt). Also calls opennode2 for T_O:1:2 to detect SRT caller connection state from stream title (ON/OFF + Caller IP). Returns: {"count":8,"connected":8,"streams":[{"svc":"EBC","port":26000,"bps":9836000,"on":1,"caller":"218.211.161.8"},...]} Normal: 8 SRT streams active (EBC/TVBS/FTV/EBCF × 2 destinations), all on=1. Column layout: [5]=dest_port, [10]=service_name, [11]=cur_bitrate_Mbps. Master item for vdcm.srt.count, vdcm.srt.connected, and vdcm.srt.discovery LLD.'
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.srt_output
          master_item:
            key: vdcm.data
      discovery_rules:
        - uuid: 7373d0c798234821912772ed17befd1b
          name: 'vDCM active alarms (LLD)'
          type: DEPENDENT
          key: vdcm.alarm.discovery
          item_prototypes:
            - uuid: 52080d862ac14441a5d3f93dde9d6039
              name: 'vDCM alarm: {#CH}'
              type: DEPENDENT
              key: 'vdcm.alarm[{#ALARM_ID}]'
              history: 7d
              value_type: CHAR
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - 'var d=JSON.parse(value);var aj=d.alarms_json||[];var id=''{#ALARM_ID}'';for(var i=0;i<aj.length;i++){if(aj[i].id===id)return aj[i].alarm;}return'''';'
              master_item:
                key: vdcm.data
              trigger_prototypes:
                - uuid: cb3daa5f11da45b588cb0e4c7a274b29
                  expression: 'count(/Synamedia vDCM Encoder by HTTP API - FTV/vdcm.alarm[{#ALARM_ID}],#4,"ne","")>=4'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'count(/Synamedia vDCM Encoder by HTTP API - FTV/vdcm.alarm[{#ALARM_ID}],#6,"eq","")>=6'
                  name: 'vDCM: {#CH}: {ITEM.LASTVALUE}'
                  priority: AVERAGE
                  manual_close: 'YES'
          master_item:
            key: vdcm.data
          lld_macro_paths:
            - lld_macro: '{#ALARM_ID}'
              path: $.id
            - lld_macro: '{#CH}'
              path: $.ch
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.alarms_json
              error_handler: CUSTOM_ERROR
              error_handler_params: '[]'
        - uuid: 4b5c6d7e8f9a4819b44b5c6d7e8f9ab5
          name: 'vDCM SDI input signal discovery'
          type: DEPENDENT
          key: vdcm.sdi.discovery
          description: 'Discovers SDI input ports from vdcm.sdi.status. Creates one signal item and trigger per SDI port. LiTV_FTV_SRT: SDI1(EBC), SDI2(TVBS), SDI3(FTV), SDI4(EBCF).'
          item_prototypes:
            - uuid: 4d32ca8ac414442aa90c5e7f151960cd
              name: '{#SDINAME} ({#SDISVC}) - signal'
              type: DEPENDENT
              key: 'vdcm.sdi.signal[{#SDINAME}]'
              history: 90d
              description: 'SDI input signal status: 1=present, 0=lost. {#SDINAME} maps to service {#SDISVC} at port {#SDIPORT}.'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var arr = JSON.parse(value);
                      var name = '{#SDINAME}';
                      for (var i = 0; i < arr.length; i++) {
                          if (arr[i].name === name) { return String(arr[i].signal); }
                      }
                      throw new Error(name + ' not found in vdcm.sdi.status response');
              master_item:
                key: vdcm.sdi.status
          trigger_prototypes:
            - uuid: aa71effcdb79405da3fed0e7e3bb690e
              expression: 'min(/Synamedia vDCM Encoder by HTTP API - FTV/vdcm.sdi.signal[{#SDINAME}],1m)=0 and nodata(/Synamedia vDCM Encoder by HTTP API - FTV/vdcm.sdi.signal[{#SDINAME}],5m)=0 and last(/Synamedia vDCM Encoder by HTTP API - FTV/vdcm.device.vdcm_state)="Active"'
              name: '{#SDINAME} ({#SDISVC}): SDI input signal lost'
              priority: HIGH
              description: 'SDI input {#SDINAME} for service {#SDISVC} has had no signal for 1+ minute while vDCM is Active. Check SDI cable and source equipment at {$VDCM.URL}.'
          master_item:
            key: vdcm.sdi.status
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var arr = JSON.parse(value);
                  return JSON.stringify(arr.map(function(s) {
                      return { '{#SDINAME}': s.name, '{#SDIPORT}': s.port, '{#SDISVC}': s.service };
                  }));
        - uuid: a1b2c3d4e5f6481987a1b2c3d4e5f697
          name: 'vDCM service bitrate discovery'
          type: DEPENDENT
          key: vdcm.service.discovery
          description: 'Discovers encoding services from vdcm.services.bitrates JSON. Creates per-service bitrate item and three triggers automatically. Services are auto-detected: no template changes needed when channels change.'
          item_prototypes:
            - uuid: b2c3d4e5f6a7481988b2c3d4e5f6a798
              name: '{#SERVICE.NAME} - bitrate'
              type: DEPENDENT
              key: 'vdcm.bitrate[{#SERVICE.NAME}]'
              history: 90d
              units: bps
              description: 'Encoding service {#SERVICE.NAME} current output bitrate in bps.'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var obj = JSON.parse(value);
                      var data = obj.services || obj;
                      var name = '{#SERVICE.NAME}';
                      for (var i = 0; i < data.length; i++) {
                          if (data[i].name === name) { return String(data[i].bps); }
                      }
                      return '0'; // service absent from response = treat as crashed (bps=0)
              master_item:
                key: vdcm.services.bitrates
          trigger_prototypes:
            - uuid: c3d4e5f6a7b8481989c3d4e5f6a7b8a9
              expression: 'min(/Synamedia vDCM Encoder by HTTP API - FTV/vdcm.bitrate[{#SERVICE.NAME}],3m)<{$VIDEO.BITRATE.MIN} and min(/Synamedia vDCM Encoder by HTTP API - FTV/vdcm.bitrate[{#SERVICE.NAME}],3m)>0 and last(/Synamedia vDCM Encoder by HTTP API - FTV/vdcm.device.vdcm_state)="Active"'
              name: '{#SERVICE.NAME}: bitrate below minimum ({ITEM.LASTVALUE})'
              priority: HIGH
              description: 'Service {#SERVICE.NAME} bitrate critically below {$VIDEO.BITRATE.MIN} bps for 3+ minutes.'
            - uuid: d4e5f6a7b8c9481980d4e5f6a7b8c9b0
              expression: 'min(/Synamedia vDCM Encoder by HTTP API - FTV/vdcm.bitrate[{#SERVICE.NAME}],3m)<{$VIDEO.BITRATE.WARN} and min(/Synamedia vDCM Encoder by HTTP API - FTV/vdcm.bitrate[{#SERVICE.NAME}],3m)>{$VIDEO.BITRATE.MIN} and last(/Synamedia vDCM Encoder by HTTP API - FTV/vdcm.device.vdcm_state)="Active"'
              name: '{#SERVICE.NAME}: bitrate is low ({ITEM.LASTVALUE})'
              priority: AVERAGE
              description: 'Service {#SERVICE.NAME} bitrate below warning threshold {$VIDEO.BITRATE.WARN} bps for 3+ minutes.'
            - uuid: eae68c25bdbe4079ad7bc78c6cc76f4f
              expression: 'nodata(/Synamedia vDCM Encoder by HTTP API - FTV/vdcm.bitrate[{#SERVICE.NAME}],5m)=1 and last(/Synamedia vDCM Encoder by HTTP API - FTV/vdcm.device.vdcm_state)="Active"'
              name: '{#SERVICE.NAME}: service missing (no data)'
              priority: DISASTER
              description: 'Service {#SERVICE.NAME} has not returned data for 5+ minutes while vDCM is Active. Service may be removed or crashed.'
            - uuid: e5f6a7b8c9d0481981e5f6a7b8c9d0c1
              expression: 'min(/Synamedia vDCM Encoder by HTTP API - FTV/vdcm.bitrate[{#SERVICE.NAME}],2m)=0 and nodata(/Synamedia vDCM Encoder by HTTP API - FTV/vdcm.bitrate[{#SERVICE.NAME}],5m)=0 and last(/Synamedia vDCM Encoder by HTTP API - FTV/vdcm.device.vdcm_state)="Active"'
              name: '{#SERVICE.NAME}: stream stopped (bitrate = 0)'
              priority: DISASTER
              description: 'Service {#SERVICE.NAME} bitrate has been 0 bps for 2+ minutes while vDCM is Active. Confirmed encoding outage. Note: with 2-min polling, min(2m)=0 fires on the first 0 reading — detection is immediate. Check at {$VDCM.URL} → Processing → {#SERVICE.NAME}.'
          master_item:
            key: vdcm.services.bitrates
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var obj = JSON.parse(value);
                  var data = obj.services || obj;
                  return JSON.stringify(data.map(function(s) {
                      return { '{#SERVICE.NAME}': s.name, '{#SERVICE.TITLE}': s.name };
                  }));
        - uuid: 7464b40c32c945b7a85fa500fc55163a
          name: 'vDCM SRT output stream discovery'
          type: DEPENDENT
          key: vdcm.srt.discovery
          description: 'Discovers SRT output streams from vdcm.srt.output. Creates per-stream: connection state (on/off) + bitrate items with triggers. LiTV_FTV_SRT: 8 streams — EBC/TVBS/FTV/EBCF × ports 26000-26007 (2 destinations each). {#SRT.SVC}=service name, {#SRT.PORT}=listen port, {#SRT.DEST}=caller/destination IP.'
          item_prototypes:
            - uuid: 24dca817ac22407bb292e8c9f55418ed
              name: '{#SRT.SVC} (:{#SRT.PORT} → {#SRT.DEST}) - SRT output bitrate'
              type: DEPENDENT
              key: 'vdcm.srt.bitrate[{#SRT.PORT}]'
              history: 90d
              units: bps
              description: 'SRT output bitrate for service {#SRT.SVC} on port :{#SRT.PORT} to {#SRT.DEST}. Source: {$VDCM.OUTPUT.CARD}.'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var obj = JSON.parse(value);
                      var port = parseInt('{#SRT.PORT}', 10);
                      var streams = obj.streams || [];
                      for (var i = 0; i < streams.length; i++) {
                          if (streams[i].port === port) return String(streams[i].bps);
                      }
                      throw new Error('{#SRT.PORT} not found in vdcm.srt.output');
              master_item:
                key: vdcm.srt.output
            - uuid: 21fe473d029c4ca9a645e2649f38af98
              name: '{#SRT.SVC} (:{#SRT.PORT} → {#SRT.DEST}) - SRT caller connected'
              type: DEPENDENT
              key: 'vdcm.srt.on[{#SRT.PORT}]'
              history: 90d
              description: 'SRT caller connection state for service {#SRT.SVC} port :{#SRT.PORT}. 1 = caller {#SRT.DEST} is connected (ON in stream title). 0 = no caller connected (OFF or title missing Caller). Detects disconnection at next 2-min poll — before bitrate drops to zero.'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var obj = JSON.parse(value);
                      var port = parseInt('{#SRT.PORT}', 10);
                      var streams = obj.streams || [];
                      for (var i = 0; i < streams.length; i++) {
                          if (streams[i].port === port) return String(streams[i].on);
                      }
                      return '0';
              master_item:
                key: vdcm.srt.output
          trigger_prototypes:
            - uuid: 44328071d1ae4a0eb39bfb474d064da6
              expression: 'last(/Synamedia vDCM Encoder by HTTP API - FTV/vdcm.srt.on[{#SRT.PORT}])=0 and nodata(/Synamedia vDCM Encoder by HTTP API - FTV/vdcm.srt.on[{#SRT.PORT}],5m)=0 and last(/Synamedia vDCM Encoder by HTTP API - FTV/vdcm.device.vdcm_state)="Active"'
              name: '{#SRT.SVC} (:{#SRT.PORT} → {#SRT.DEST}): SRT caller disconnected'
              priority: DISASTER
              description: 'SRT caller for {#SRT.SVC} on port :{#SRT.PORT} (remote: {#SRT.DEST}) is not connected. The stream title changed from "ON ... (Caller {#SRT.DEST})" — content delivery to this destination has stopped. Check SRT caller at {#SRT.DEST} and network path to {$VDCM.URL} > Output > Port 3 Mgmt.'
            - uuid: 463f625a94d74a80b93155969c970cc3
              expression: 'min(/Synamedia vDCM Encoder by HTTP API - FTV/vdcm.srt.bitrate[{#SRT.PORT}],3m)=0 and nodata(/Synamedia vDCM Encoder by HTTP API - FTV/vdcm.srt.bitrate[{#SRT.PORT}],5m)=0 and last(/Synamedia vDCM Encoder by HTTP API - FTV/vdcm.device.vdcm_state)="Active"'
              name: '{#SRT.SVC} (:{#SRT.PORT} → {#SRT.DEST}): SRT output bitrate zero'
              priority: AVERAGE
              description: 'SRT output bitrate for {#SRT.SVC} on port :{#SRT.PORT} (to {#SRT.DEST}) has been 0 bps for 3+ minutes. Secondary indicator — if caller is still connected (vdcm.srt.on=1), this may indicate an encoding fault rather than network disconnection. Primary disconnection alarm: "{#SRT.SVC} (:{#SRT.PORT} → {#SRT.DEST}): SRT caller disconnected" (DISASTER). Check at {$VDCM.URL} > Output > I/O 1 > Port 3 Mgmt.'
          master_item:
            key: vdcm.srt.output
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var obj = JSON.parse(value);
                  return JSON.stringify((obj.streams || []).map(function(s) {
                      return {
                          '{#SRT.SVC}':  s.svc,
                          '{#SRT.PORT}': String(s.port),
                          '{#SRT.DEST}': s.caller || ''
                      };
                  }));
      macros:
        - macro: '{$VDCM.ALARM.COUNT.MAX}'
          value: '0'
        - macro: '{$VDCM.INPUT.CARDS}'
          value: 'T_I:2:0,T_I:2:1,T_I:2:2,T_I:2:3'
          description: 'Input card xIDs for processing alarm checks. T_I:2:0~T_I:2:3 = Board 2 (vMFP 2), Kona4_1 SDI1-SDI4. These are the four SDI input ports for EBC/TVBS/FTV/EBCF. Note: T_I:2:4 does NOT exist on this device (verified 2026-06-11).'
        - macro: '{$VDCM.OUTPUT.CARD}'
          value: 'T_O:1:2'
          description: 'Output node xID for Port 3 Mgmt (I/O 1, Board 1). T_O:1:2 = Port 3 Mgmt on I/O 1 (0-indexed: Port1=:0, Port3=:2, Port5=:4). Verified 2026-06: contains 8 SRT streams (EBC/TVBS/FTV/EBCF x2 destinations).'
        - macro: '{$VDCM.PASS}'
          type: SECRET_TEXT
          description: 'vDCM web login password. Set per-host as Secret macro.'
        - macro: '{$VDCM.PROC.NODE}'
          value: 'T_T:2:*:*:e0'
          description: 'Processing node xID for /bitrates/processing queries. T_T:2:*:*:e0 = vMFP 2 processing summary node. Verified 2026-06: returns 4 service rows (EBC/TVBS/FTV/EBCF) with cur ~9.8-9.9 Mbps each.'
        - macro: '{$VDCM.SDI.NODES}'
          value: 'T_I:2:0:*:512,T_I:2:1:*:513,T_I:2:2:*:514,T_I:2:3:*:515'
          description: 'Comma-separated SDI stream xID nodes for signal monitoring. SDI1=T_I:2:0:*:512(EBC), SDI2=T_I:2:1:*:513(TVBS), SDI3=T_I:2:2:*:514(FTV), SDI4=T_I:2:3:*:515(EBCF). Verified 2026-06-11 on LiTV_FTV_SRT (61.220.40.194:4431). Set empty string to disable SDI monitoring.'
        - macro: '{$VDCM.SRT.COUNT.MIN}'
          value: '8'
          description: 'Minimum expected number of active SRT output streams on Port 3 Mgmt (T_O:1:2). EBC/TVBS/FTV/EBCF × 2 destinations (218.211.161.8 + 211.21.3.210) = 8 total streams. DISASTER trigger fires if active stream count falls below this value.'
        - macro: '{$VDCM.SVC.COUNT.MIN}'
          value: '4'
          description: 'Minimum expected number of encoding services. DISASTER trigger fires if fewer. EBC/TVBS/FTV/EBCF = 4.'
        - macro: '{$VDCM.URL}'
          value: 'https://61.220.40.194:4431'
          description: 'vDCM web UI base URL, no trailing slash.'
        - macro: '{$VDCM.USER}'
          value: Administrator
          description: 'vDCM web login username'
        - macro: '{$VIDEO.BITRATE.MIN}'
          value: '5000000'
          description: 'Critical threshold in bps. Default 5,000,000 bps (5 Mbps = 50% of 10 Mbps nominal). Trigger fires when encoding is severely degraded but not stopped.'
        - macro: '{$VIDEO.BITRATE.WARN}'
          value: '8000000'
          description: 'Warning threshold in bps. Default 8,000,000 bps (8 Mbps = 80% of 10 Mbps nominal). EBC/EBCF/FTV/TVBS normal range: 9.6-10.3 Mbps.'
        - macro: '{$VIDEO.PROC.BITRATE.WARN}'
          value: '30000000'
          description: 'Warning threshold for total processing bitrate in bps. Default 30,000,000 bps (30 Mbps = ~75% of 39.6 Mbps nominal). Fires HIGH alert when total output drops significantly (one or more services degraded).'
  triggers:
    - uuid: df2b9a9517304702b4a1dc7b3426b9aa
      expression: 'min(/Synamedia vDCM Encoder by HTTP API - FTV/vdcm.proc.bitrate,2m)=0 and nodata(/Synamedia vDCM Encoder by HTTP API - FTV/vdcm.proc.bitrate,5m)=0 and last(/Synamedia vDCM Encoder by HTTP API - FTV/vdcm.device.vdcm_state)="Active"'
      name: 'vDCM: all encoding stopped (total output = 0 bps)'
      priority: DISASTER
      description: 'Total processing bitrate has been 0 bps for 2+ minutes while device is Active. All services have stopped encoding.'
    - uuid: 7129a172b32344008d56e6345149aef1
      expression: 'min(/Synamedia vDCM Encoder by HTTP API - FTV/vdcm.services.count,3m)<{$VDCM.SVC.COUNT.MIN} and nodata(/Synamedia vDCM Encoder by HTTP API - FTV/vdcm.services.count,5m)=0 and last(/Synamedia vDCM Encoder by HTTP API - FTV/vdcm.device.vdcm_state)="Active"'
      name: 'vDCM: fewer encoding services than expected ({ITEM.LASTVALUE}<{$VDCM.SVC.COUNT.MIN})'
      priority: DISASTER
      description: 'Number of active encoding services below {$VDCM.SVC.COUNT.MIN} for 3+ minutes. Expected: EBC, TVBS, FTV, EBCF.'
    - uuid: 8f23f24820e74dff942b6e2c39d33fe1
      expression: 'last(/Synamedia vDCM Encoder by HTTP API - FTV/vdcm.srt.connected)<{$VDCM.SRT.COUNT.MIN} and nodata(/Synamedia vDCM Encoder by HTTP API - FTV/vdcm.srt.connected,5m)=0 and last(/Synamedia vDCM Encoder by HTTP API - FTV/vdcm.device.vdcm_state)="Active"'
      name: 'vDCM: SRT caller disconnected ({ITEM.LASTVALUE}/{$VDCM.SRT.COUNT.MIN} streams connected)'
      priority: DISASTER
      description: 'One or more SRT output streams lost their caller connection (ON flag missing or no Caller IP). Stream title changes from "[SRT] EBC (1) ON ID:1 ... (Caller ...)" to "OFF" or loses Caller info. Expected {$VDCM.SRT.COUNT.MIN} connected callers (218.211.161.8 + 211.21.3.210 × 4 services). Content delivery is interrupted. Check Output > I/O 1 > Port 3 Mgmt at {$VDCM.URL}.'
    - uuid: f24b9d0d8256470f853e1d9431126492
      expression: 'last(/Synamedia vDCM Encoder by HTTP API - FTV/vdcm.srt.count)<{$VDCM.SRT.COUNT.MIN} and nodata(/Synamedia vDCM Encoder by HTTP API - FTV/vdcm.srt.count,5m)=0 and last(/Synamedia vDCM Encoder by HTTP API - FTV/vdcm.device.vdcm_state)="Active"'
      name: 'vDCM: SRT stream count dropped ({ITEM.LASTVALUE} < {$VDCM.SRT.COUNT.MIN})'
      priority: HIGH
      description: 'SRT output stream count in bitrate table dropped below {$VDCM.SRT.COUNT.MIN}. This indicates a stream was removed from vDCM configuration or the bitrate table is not returning all rows. (For caller disconnection, see vdcm.srt.connected trigger.) Check Output > I/O 1 > Port 3 Mgmt at {$VDCM.URL}.'
