      name: 'Synamedia vDCM Encoder by HTTP API (YU-WEI IDC)'
      description: |
        Synamedia vDCM HTTP API monitor for YU-WEI IDC (litv_tran1/tran2).
        Output bitrate: LLD via /service/overview/opennode2 (nodetype=S, {$VDCM.PROC.NODE}). Input bitrate: LLD via /bitrates/input/refresh + get_rows ({$VDCM.INPUT.CARDS}). Alarms: /status/alarms/get_rows + /status/processing/get_rows (background noise filtered). Device health: /load_alarm_footer → alarm_count, device_state, vdcm_state.
      vendor:
        name: LiTV
        version: 7.4.11
      groups:
        - name: 'Templates/Network devices'
      items:
        - uuid: c1d2e3f4a5b6470893c1d2e3f4a5b6c7
          name: 'vDCM SNMP Trap (trapControlMsgTrap)'
          type: SNMP_TRAP
          key: 'snmptrap[trapControlMsgTrap]'
          history: 7d
          value_type: LOG
          description: |
            Receives all Synamedia vDCM SNMP traps (trapControlMsgTrap / trapControlMsgTrap2).
            Single item for all severities — prevents duplicate alerts when vDCM sends the same fault at multiple severity levels.
            Output: "Channel: AlarmText" (RAISED) or "Channel: AlarmText — Cleared" (CLEARED).
            Channel name resolution priority: GroupName → UserTag → {$SNMP.IP.MAP} lookup → raw location.
            Noise filtered: PTS Discontinuity, UDP/TS Stream Loss, Input Signal Loss.
            Prerequisites: StartSNMPTrapper=1, SNMPTrapperFile=/var/log/snmptrap/snmptrap.log, host SNMP interface configured.
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  // Parse Synamedia vDCM SNMP trap from /var/log/snmptrap/snmptrap.log.
                  // Single item handles all severities — SINGLE trigger prevents duplicate notifications
                  // when vDCM sends the same fault at multiple severity levels (e.g. sev:2 then sev:5).
                  var rawValue = value || '';
                  var sourceIp = '';
                  var sourceMatch = rawValue.match(/receivedfrom\s+UDP:\s*\[?(\d+\.\d+\.\d+\.\d+)\]?:/i);
                  if (sourceMatch) sourceIp = sourceMatch[1];
                  var expectedHost = ('{$VDCM.URL}' || '').replace(/^https?:\/\//i, '').replace(/:\d+.*$/, '').trim();
                  if (sourceIp && expectedHost && sourceIp !== expectedHost) {
                    throw 'source-mismatch:' + sourceIp + '!=' + expectedHost;
                  }
                  var mBeh = rawValue.match(/msgBehaviour\.\d+ type=\d+\s+value=INTEGER: (\d+)/);
                  var mTxt = rawValue.match(/msgText\.\d+ type=\d+\s+value=STRING: "([^"]+)"/);
                  var mSub = rawValue.match(/msgSubject\.\d+ type=\d+\s+value=STRING: "([^"]+)"/);
                  var mDet = rawValue.match(/msgDetail\.\d+ type=\d+\s+value=STRING: "([^"]+)"/);
                  var mStat = rawValue.match(/msgStatus\.\d+ type=\d+\s+value=INTEGER: (\d+)/);
                  if (!mBeh || !mTxt) throw 'unparseable trap';
                  // Discard msgBehaviour=0 (instantaneous/transient): no clear counterpart, would latch trigger open
                  if (mBeh[1] === '0') throw 'transient:' + mTxt[1];
                  // Noise classification:
                  // ALWAYS_NOISE: inherently meaningless regardless of channel
                  // SLOT_NOISE:   only noise when channel is unknown (empty port slot); real if channel is identified
                  var ALWAYS_NOISE = ['Input Signal Loss', 'No Input Signal'];
                  var SLOT_NOISE   = ['PTS Discontinuity', 'UDP Stream Loss', 'TS Stream Loss'];
                  if (ALWAYS_NOISE.indexOf(mTxt[1]) >= 0) throw 'always-noise:' + mTxt[1];
                  // Channel name resolution: GroupName → UserTag → IP map → none
                  var groupName = '';
                  function resolveGroupName(text) {
                    if (!text) return '';
                    var gm = text.match(/GroupName\s*=\s*([^=;\r\n]+)(?:=|;|$)/i);
                    if (gm) return gm[1].trim();
                    var gt = text.match(/GroupName\s*=\s*([^\r\n;]+)/i);
                    if (gt) return gt[1].trim();
                    return '';
                  }
                  if (mDet) { groupName = resolveGroupName(mDet[1]); }
                  if (!groupName && mSub) { groupName = resolveGroupName(mSub[1]); }
                  if (!groupName) {
                    var utm = mSub ? mSub[1].match(/UserTag\s+([^,]+)/) : null;
                    if (utm) { var ut = utm[1].trim().replace(/\s*\(.*$/, '').trim(); if (ut) groupName = ut; } // strip ABR profile "(WxH @ Kbps)(MR)", skip empty UserTag
                  }
                  if (!groupName) {
                    var tsIp = '';
                    if (mDet) { var dtm = mDet[1].match(/TS=(\d+\.\d+\.\d+\.\d+:\d+)=/); if (dtm) tsIp = dtm[1]; }
                    if (!tsIp && mSub) { var stm = mSub[1].match(/TS (\d+\.\d+\.\d+\.\d+:\d+)/); if (stm) tsIp = stm[1]; }
                    if (tsIp) { try { var m=JSON.parse('{$SNMP.IP.MAP}'); groupName=m[tsIp]||m[':'+tsIp.split(':')[1]]||''; } catch(e){} }
                  }
                  // Suppress SLOT_NOISE only when no channel name (empty port slot)
                  if (!groupName && SLOT_NOISE.indexOf(mTxt[1]) >= 0) throw 'slot-noise:' + mTxt[1];
                  var base = groupName ? groupName + ': ' + mTxt[1] : mTxt[1];
                  if (!groupName && mSub) base += ' (' + mSub[1] + ')'; // show location when no channel name
                  // msgBehaviour=1: explicit cleared (other firmware variants)
                  if (mBeh[1] === '1') return base + ' — Cleared';
                  // msgBehaviour=2 + msgStatus=0: real clear event for Synamedia traps.
                  // Do not discard it; otherwise the trigger never recovers even though the device has already cleared the fault.
                  if (mBeh[1] === '2' && mStat && mStat[1] === '0') return base + ' — Cleared';
                  return base;
