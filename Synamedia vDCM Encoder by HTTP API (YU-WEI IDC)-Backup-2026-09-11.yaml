              recovery_mode: RECOVERY_EXPRESSION
              recovery_expression: 'last(/Synamedia vDCM Encoder by HTTP API - YU-WEI IDC/vdcm.alarms.detail)="OK" or last(/Synamedia vDCM Encoder by HTTP API - YU-WEI IDC/vdcm.alarms.detail)="" or find(/Synamedia vDCM Encoder by HTTP API - YU-WEI IDC/vdcm.alarms.detail,,"like","ERROR:")=1'
              name: 'vDCM: real alarm text active (current: {ITEM.LASTVALUE})'
              priority: AVERAGE
              description: 'Fires only when the parser returns a real alarm message. Ignores empty values and parser failures such as "ERROR: TypeError...". This is the actual alarm text from the vDCM API, not a derived count.'
              manual_close: 'YES'
