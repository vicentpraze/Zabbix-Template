zabbix_export:
  version: '7.4'
  template_groups:
    - uuid: c7691cb0ae02412a87bcda2e1db5184c
      name: 'Templates/Network devices'
  templates:
    - uuid: 829666074f994a01a1048968b329c220
      template: 'QCAP SC6D0 Encoder by HTTP API'
      name: 'QCAP SC6D0 Encoder by HTTP API'
      description: |
        QCAP SC6D0-board HDMI/SDI encoder, monitored via its undocumented JSON web API (not SNMP/RTSP).
        API: POST /_dev{0-9} (one path per physical channel), JSON body {qcapid, sessid, Function, ...}.
        Login: POST /_dev{first channel} {"login": "<user>:myrealm:" + md5("<user>:myrealm:" + password)}
          -> {"_error_":"ok","sessid":"..."}. sessid is then passed in the JSON body of every
          subsequent call (no cookie needed - verified live, cookie-less calls work).
        Per channel per poll: APPS_GET_INPUT_FORMAT (Signal 0/1, Width, Height, Framerate) and
        APPS_GET_STREAMING_STATUS (StreamNum 1=main/2=sub: Status 0/1, Connections, EncoderNum;
        EncoderNum=9 means that stream is disabled/unconfigured).
        Verified live 2026-09-18 against 123.51.156.115:8083 (BoardID SC6D0N1AIOM_V20):
        dev0 = no input signal (Signal=0, stable across repeated polls); dev1 = signal present
        (1920x1080@30fps) and actively streaming (Status=1, Connections=1). dev2 = no signal,
        all-zero format (nothing connected). dev3 = HTTP 503 (channel does not exist on this unit).
        Set {$QCAP.CHANNELS} to the comma-separated dev indices that actually exist on a given host.
      vendor:
        name: LiTV
        version: 7.4.11
      groups:
        - name: 'Templates/Network devices'
      items:
        - uuid: 6ce7a90283b04a66ba477c6fee763023
          name: 'QCAP master data (all-in-one)'
          type: SCRIPT
          key: qcap.data
          delay: 30s
          history: 1h
          value_type: TEXT
          params: |
            // QCAP SC6D0 Master Data Collector
            var url='{$QCAP.URL}'.replace(/\/+$/,'');
            var user='{$QCAP.USER}',pass='{$QCAP.PASS}';
            // {$QCAP.CHANNELS} accepts a mix of raw dev indices ("1") and/or input-type names
            // ("SDI", "HDMI", case-insensitive) - type names are resolved to dev indices below by
            // probing {$QCAP.PROBE.RANGE} (a small, bounded, known-real set of dev paths - NOT a
            // blind 0-9 scan) once per poll.
            var chanTokens='{$QCAP.CHANNELS}'.split(',').map(function(s){return s.trim();}).filter(Boolean);
            var probeRange='{$QCAP.PROBE.RANGE}'.split(',').map(function(s){return s.trim();}).filter(Boolean);
            if(!url||url.indexOf('http')!==0) throw new Error('Invalid {$QCAP.URL}: "'+url+'"');
            if(chanTokens.length===0) throw new Error('Empty {$QCAP.CHANNELS}');
            if(probeRange.length===0) throw new Error('Empty {$QCAP.PROBE.RANGE}');

            // Inline MD5 (device login token is user+":myrealm:"+md5(user+":myrealm:"+pass)).
            // Device has no external crypto API reachable from Zabbix's script sandbox, so this
            // reimplements the same algorithm the device's own js/md5.min.js uses client-side.
            function md5(inputString) {
              var hc="0123456789abcdef";
              function rh(n){var j,s="";for(j=0;j<=3;j++)s+=hc.charAt((n>>(j*8+4))&0x0F)+hc.charAt((n>>(j*8))&0x0F);return s;}
              function ad(x,y){var l=(x&0xFFFF)+(y&0xFFFF);var m=(x>>16)+(y>>16)+(l>>16);return (m<<16)|(l&0xFFFF);}
              function rl(n,c){return (n<<c)|(n>>>(32-c));}
              function cm(q,a,b,x,s,t){return ad(rl(ad(ad(a,q),ad(x,t)),s),b);}
              function ff(a,b,c,d,x,s,t){return cm((b&c)|((~b)&d),a,b,x,s,t);}
              function gg(a,b,c,d,x,s,t){return cm((b&d)|(c&(~d)),a,b,x,s,t);}
              function hh(a,b,c,d,x,s,t){return cm(b^c^d,a,b,x,s,t);}
              function ii(a,b,c,d,x,s,t){return cm(c^(b|(~d)),a,b,x,s,t);}
              function sb(x){var i;var nblk=((x.length+8)>>6)+1;var blks=new Array(nblk*16);for(i=0;i<nblk*16;i++)blks[i]=0;for(i=0;i<x.length;i++)blks[i>>2]|=x.charCodeAt(i)<<((i%4)*8);blks[i>>2]|=0x80<<((i%4)*8);blks[nblk*16-2]=x.length*8;return blks;}
              var i,x=sb(inputString),a=1732584193,b=-271733879,c=-1732584194,d=271733878,olda,oldb,oldc,oldd;
              for(i=0;i<x.length;i+=16){
                olda=a;oldb=b;oldc=c;oldd=d;
                a=ff(a,b,c,d,x[i+0],7,-680876936);d=ff(d,a,b,c,x[i+1],12,-389564586);c=ff(c,d,a,b,x[i+2],17,606105819);b=ff(b,c,d,a,x[i+3],22,-1044525330);
                a=ff(a,b,c,d,x[i+4],7,-176418897);d=ff(d,a,b,c,x[i+5],12,1200080426);c=ff(c,d,a,b,x[i+6],17,-1473231341);b=ff(b,c,d,a,x[i+7],22,-45705983);
                a=ff(a,b,c,d,x[i+8],7,1770035416);d=ff(d,a,b,c,x[i+9],12,-1958414417);c=ff(c,d,a,b,x[i+10],17,-42063);b=ff(b,c,d,a,x[i+11],22,-1990404162);
                a=ff(a,b,c,d,x[i+12],7,1804603682);d=ff(d,a,b,c,x[i+13],12,-40341101);c=ff(c,d,a,b,x[i+14],17,-1502002290);b=ff(b,c,d,a,x[i+15],22,1236535329);
                a=gg(a,b,c,d,x[i+1],5,-165796510);d=gg(d,a,b,c,x[i+6],9,-1069501632);c=gg(c,d,a,b,x[i+11],14,643717713);b=gg(b,c,d,a,x[i+0],20,-373897302);
                a=gg(a,b,c,d,x[i+5],5,-701558691);d=gg(d,a,b,c,x[i+10],9,38016083);c=gg(c,d,a,b,x[i+15],14,-660478335);b=gg(b,c,d,a,x[i+4],20,-405537848);
                a=gg(a,b,c,d,x[i+9],5,568446438);d=gg(d,a,b,c,x[i+14],9,-1019803690);c=gg(c,d,a,b,x[i+3],14,-187363961);b=gg(b,c,d,a,x[i+8],20,1163531501);
                a=gg(a,b,c,d,x[i+13],5,-1444681467);d=gg(d,a,b,c,x[i+2],9,-51403784);c=gg(c,d,a,b,x[i+7],14,1735328473);b=gg(b,c,d,a,x[i+12],20,-1926607734);
                a=hh(a,b,c,d,x[i+5],4,-378558);d=hh(d,a,b,c,x[i+8],11,-2022574463);c=hh(c,d,a,b,x[i+11],16,1839030562);b=hh(b,c,d,a,x[i+14],23,-35309556);
                a=hh(a,b,c,d,x[i+1],4,-1530992060);d=hh(d,a,b,c,x[i+4],11,1272893353);c=hh(c,d,a,b,x[i+7],16,-155497632);b=hh(b,c,d,a,x[i+10],23,-1094730640);
                a=hh(a,b,c,d,x[i+13],4,681279174);d=hh(d,a,b,c,x[i+0],11,-358537222);c=hh(c,d,a,b,x[i+3],16,-722521979);b=hh(b,c,d,a,x[i+6],23,76029189);
                a=hh(a,b,c,d,x[i+9],4,-640364487);d=hh(d,a,b,c,x[i+12],11,-421815835);c=hh(c,d,a,b,x[i+15],16,530742520);b=hh(b,c,d,a,x[i+2],23,-995338651);
                a=ii(a,b,c,d,x[i+0],6,-198630844);d=ii(d,a,b,c,x[i+7],10,1126891415);c=ii(c,d,a,b,x[i+14],15,-1416354905);b=ii(b,c,d,a,x[i+5],21,-57434055);
                a=ii(a,b,c,d,x[i+12],6,1700485571);d=ii(d,a,b,c,x[i+3],10,-1894986606);c=ii(c,d,a,b,x[i+10],15,-1051523);b=ii(b,c,d,a,x[i+1],21,-2054922799);
                a=ii(a,b,c,d,x[i+8],6,1873313359);d=ii(d,a,b,c,x[i+15],10,-30611744);c=ii(c,d,a,b,x[i+6],15,-1560198380);b=ii(b,c,d,a,x[i+13],21,1309151649);
                a=ii(a,b,c,d,x[i+4],6,-145523070);d=ii(d,a,b,c,x[i+11],10,-1120210379);c=ii(c,d,a,b,x[i+2],15,718787259);b=ii(b,c,d,a,x[i+9],21,-343485551);
                a=ad(a,olda);b=ad(b,oldb);c=ad(c,oldc);d=ad(d,oldd);
              }
              return rh(a)+rh(b)+rh(c)+rh(d);
            }

            function post(devPath, bodyObj){
              var req=new HttpRequest();
              try{req.setopt(13,15);}catch(e){}
              try{req.setopt(78,8);}catch(e){}
              req.addHeader('Content-Type: application/json');
              req.addHeader('Connection: close');
              var resp=req.post(url+devPath, JSON.stringify(bodyObj));
              try{return JSON.parse(resp);}catch(e){return {_error_:'parse_error',_raw_:String(resp).substring(0,200)};}
            }

            var qcapid='53434352514B4352';
            var realm=user+':myrealm:';
            var token=realm+md5(realm+pass);
            var loginResp=post('/_dev'+probeRange[0], {login: token});
            if(!loginResp || loginResp._error_!=='ok' || !loginResp.sessid){
              throw new Error('Login failed: '+JSON.stringify(loginResp));
            }
            var sessid=loginResp.sessid;

            // VideoSource numeric code -> human-readable input type (from the device's own
            // Source_setting.js UI logic). No "channel name" field exists on this unit (Name/Group
            // are both blank on every channel - confirmed live) so this is the best identifying
            // label auto-scannable per channel.
            var SRC_TYPES={0:'Composite',1:'S-Video',2:'HDMI',3:'DVI',4:'YPbPr',5:'VGA',6:'SDI',7:'Image',8:'IP Stream',9:'Playback',10:'NDI',11:'UVC',12:'DP',13:'HLS'};

            // Probe every dev path in {$QCAP.PROBE.RANGE} once to learn its input type. This
            // cache is reused both to resolve type-name tokens in {$QCAP.CHANNELS} (e.g. "SDI")
            // and to avoid a second APPS_GET_VIDEO_SOURCE call later for channels already probed.
            var probeType={};
            probeRange.forEach(function(idx){
              try{
                var vsrc=post('/_dev'+idx, {qcapid:qcapid, sessid:sessid, Function:'APPS_GET_VIDEO_SOURCE'});
                if(vsrc && vsrc.Return===0){
                  probeType[idx]={type:SRC_TYPES[vsrc.VideoSource]||('type'+vsrc.VideoSource), name:String(vsrc.Name||'').trim()};
                }
              }catch(e){}
            });

            // Resolve {$QCAP.CHANNELS} tokens to actual dev indices: a purely-numeric token is
            // used as-is; anything else is matched case-insensitively against the probed type
            // (e.g. "SDI" or "HDMI") of every entry in {$QCAP.PROBE.RANGE}.
            var channels=[];
            chanTokens.forEach(function(tok){
              if(/^\d+$/.test(tok)){
                if(channels.indexOf(tok)<0) channels.push(tok);
                return;
              }
              var wanted=tok.toLowerCase();
              Object.keys(probeType).forEach(function(idx){
                if(probeType[idx].type.toLowerCase()===wanted && channels.indexOf(idx)<0) channels.push(idx);
              });
            });
            if(channels.length===0) throw new Error('{$QCAP.CHANNELS}="'+chanTokens.join(',')+'" matched no dev index in {$QCAP.PROBE.RANGE}="'+probeRange.join(',')+'"');

            // Manual per-channel name override ({"<dev index>":"<real channel name>"}) - the
            // device has no configurable name field that survives (Name/Group always blank), so
            // this is filled in from what's actually plugged into each input, not auto-detected.
            var chanNames={};
            try{chanNames=JSON.parse('{$QCAP.CHANNEL.NAME}');}catch(e){}

            var result={channels:[]};
            channels.forEach(function(ch){
              var devPath='/_dev'+ch;
              var chData={ch:ch, signal:-1, width:0, height:0, framerate:0, type:'unknown', name:'', streams:[]};
              try{
                var inFmt=post(devPath, {qcapid:qcapid, sessid:sessid, Function:'APPS_GET_INPUT_FORMAT'});
                if(inFmt && inFmt.Return===0){
                  chData.signal=inFmt.Signal;
                  chData.width=inFmt.Width;
                  chData.height=inFmt.Height;
                  chData.framerate=inFmt.Framerate;
                }
              }catch(e){}
              try{
                var vsrc=probeType[ch];
                if(!vsrc){
                  var vsrcRaw=post(devPath, {qcapid:qcapid, sessid:sessid, Function:'APPS_GET_VIDEO_SOURCE'});
                  if(vsrcRaw && vsrcRaw.Return===0) vsrc={type:SRC_TYPES[vsrcRaw.VideoSource]||('type'+vsrcRaw.VideoSource), name:String(vsrcRaw.Name||'').trim()};
                }
                if(vsrc){
                  chData.type=vsrc.type;
                  chData.name=vsrc.name;
                }
              }catch(e){}
              if(!chData.name && chanNames[ch]) chData.name=String(chanNames[ch]).trim();
              chData.label=chData.name || chData.type;
              [1,2].forEach(function(streamNum){
                try{
                  var st=post(devPath, {qcapid:qcapid, sessid:sessid, Function:'APPS_GET_STREAMING_STATUS', StreamNum:streamNum});
                  if(st && st.Return===0){
                    chData.streams.push({num:streamNum, status:st.Status, connections:st.Connections, encodernum:st.EncoderNum});
                  }
                }catch(e){}
              });
              result.channels.push(chData);
            });
            return JSON.stringify(result);
          description: 'Master item: logs into the QCAP SC6D0 device once per poll, queries APPS_GET_INPUT_FORMAT + APPS_GET_STREAMING_STATUS (main+sub) for every channel in {$QCAP.CHANNELS}, returns combined JSON. All per-channel items below are DEPENDENT on this one (no extra device calls).'
          triggers:
            - uuid: 4bf50405e7324e58bde0fb61b7ef325f
              expression: 'nodata(/QCAP SC6D0 Encoder by HTTP API/qcap.data,{$QCAP.NODATA})=1'
              name: 'QCAP: no data for {$QCAP.NODATA} (device unreachable, wrong URL/credentials, or login failing)'
              priority: HIGH
              description: 'The master item itself has not produced a value. Check {$QCAP.URL}, {$QCAP.USER}, {$QCAP.PASS}, and network reachability. All per-channel monitoring below is blind while this is active.'
      discovery_rules:
        - uuid: bd958e4416974e428a2a7f5fbc269672
          name: 'QCAP channel discovery'
          type: DEPENDENT
          key: qcap.channel.discovery
          description: 'Discovers one {#CH} per entry in qcap.data''s channels array (one per {$QCAP.CHANNELS} dev index).'
          item_prototypes:
            - uuid: a17a3f7905a846b5a03cf2925828bd7f
              name: 'QCAP {#CH} ({#NAME}): input signal'
              type: DEPENDENT
              key: 'qcap.signal[{#CH}]'
              value_type: UNSIGNED
              history: 7d
              description: 'From APPS_GET_INPUT_FORMAT.Signal: 1 = valid input signal, 0 = no signal.'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var d=JSON.parse(value);
                      var c=(d.channels||[]).filter(function(x){return x.ch==='{#CH}';})[0];
                      return (c && typeof c.signal==='number') ? c.signal : 0;
              master_item:
                key: qcap.data
              trigger_prototypes:
                - uuid: acbdb7a71327464abf068e18958f2e4f
                  expression: 'max(/QCAP SC6D0 Encoder by HTTP API/qcap.signal[{#CH}],{$QCAP.SIGNAL.MISSING.TIME})=0'
                  name: 'QCAP {#CH} ({#NAME}): No input signal for {$QCAP.SIGNAL.MISSING.TIME}'
                  priority: WARNING
                  description: 'Signal has been 0 for the entire {$QCAP.SIGNAL.MISSING.TIME} window (max()=0 means no 1 occurred in that period). Per-channel override via {$QCAP.SIGNAL.MISSING.TIME:<CH>} for channels that are intentionally idle/unused (e.g. set to 24h to effectively disable).'
            - uuid: 77f703debdf240c39f62454aea7123ee
              name: 'QCAP {#CH} ({#NAME}): main stream status'
              type: DEPENDENT
              key: 'qcap.stream.status[{#CH}]'
              value_type: UNSIGNED
              history: 7d
              description: 'From APPS_GET_STREAMING_STATUS (StreamNum=1, "main"): Status 1 = actively streaming, 0 = stopped.'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var d=JSON.parse(value);
                      var c=(d.channels||[]).filter(function(x){return x.ch==='{#CH}';})[0];
                      if(!c) return 0;
                      var s=(c.streams||[]).filter(function(x){return x.num===1;})[0];
                      return s ? s.status : 0;
              master_item:
                key: qcap.data
              trigger_prototypes:
                - uuid: 95b15f5994f94b24855e55223a77ff26
                  expression: 'last(/QCAP SC6D0 Encoder by HTTP API/qcap.signal[{#CH}])=1 and last(/QCAP SC6D0 Encoder by HTTP API/qcap.stream.status[{#CH}])=0'
                  name: 'QCAP {#CH} ({#NAME}): streaming stopped despite valid input signal'
                  priority: AVERAGE
                  description: 'Input signal is present but the main stream (StreamNum=1) is not active - likely an encoder/network/streaming-target problem rather than a source signal problem. Check vDCM {$QCAP.URL} web UI > Status.'
            - uuid: d99b94b8362a49b084068b507e806b6f
              name: 'QCAP {#CH} ({#NAME}): main stream connections'
              type: DEPENDENT
              key: 'qcap.stream.connections[{#CH}]'
              value_type: UNSIGNED
              history: 7d
              description: 'From APPS_GET_STREAMING_STATUS (StreamNum=1, "main"): number of active viewer/client connections.'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var d=JSON.parse(value);
                      var c=(d.channels||[]).filter(function(x){return x.ch==='{#CH}';})[0];
                      if(!c) return 0;
                      var s=(c.streams||[]).filter(function(x){return x.num===1;})[0];
                      return s ? s.connections : 0;
              master_item:
                key: qcap.data
            - uuid: 2efe224dbd544c8c8f463d779b8980ec
              name: 'QCAP {#CH} ({#NAME}): input resolution'
              type: DEPENDENT
              key: 'qcap.resolution[{#CH}]'
              value_type: TEXT
              history: 7d
              description: 'From APPS_GET_INPUT_FORMAT: "<width>x<height>@<framerate>fps". Informational; watch for unexpected resolution/framerate changes on the source.'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var d=JSON.parse(value);
                      var c=(d.channels||[]).filter(function(x){return x.ch==='{#CH}';})[0];
                      if(!c) return 'unknown';
                      return c.width+'x'+c.height+'@'+c.framerate+'fps';
              master_item:
                key: qcap.data
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var d=JSON.parse(value);
                  return JSON.stringify((d.channels||[]).map(function(c){return {'{#CH}': c.ch, '{#TYPE}': c.type||'unknown', '{#NAME}': c.label||c.type||'unknown'};}));
          master_item:
            key: qcap.data
      macros:
        - macro: '{$QCAP.URL}'
          value: 'http://123.51.156.115:8083'
          description: 'QCAP SC6D0 web/API base URL, no trailing slash.'
        - macro: '{$QCAP.USER}'
          value: Admin
          description: 'QCAP SC6D0 login username.'
        - macro: '{$QCAP.PASS}'
          type: SECRET_TEXT
          description: 'QCAP SC6D0 login password. Set per-host as Secret macro.'
        - macro: '{$QCAP.CHANNELS}'
          value: '0,1'
          description: |
            Which channels to actually monitor (poll + create items/triggers for). Comma-separated
            list, each entry is EITHER:
              - a raw /_devN index, e.g. "1" (used exactly as given, no lookup needed), OR
              - an input-type name, e.g. "SDI" or "HDMI" (case-insensitive) - resolved at runtime
                to every dev index in {$QCAP.PROBE.RANGE} whose detected VideoSource type matches.
            The two forms can be mixed, e.g. "1,HDMI" = dev index 1 plus every HDMI-type channel
            found in the probe range. Type names are matched against a fresh probe done once per
            30s poll (bounded to {$QCAP.PROBE.RANGE}, never a blind 0-9 scan) so this stays cheap.
            Examples for this unit (123.51.156.115:8083, BoardID SC6D0N1AIOM_V20):
              "1"        -> only dev1 (the live SDI/CTVMain channel). Current value on this host.
              "SDI"      -> equivalent to "1" here (dev1 is the only SDI-type channel found),
                             but self-adjusting if the physical wiring ever changes which dev index is SDI.
              "HDMI"     -> would resolve to dev0 (currently unused/no signal - see {$QCAP.SIGNAL.MISSING.TIME}).
              "0,1"      -> both channels regardless of type (original default before dev0 was excluded).
            Verified live 2026-09-18: dev0=HDMI (no signal), dev1=SDI (signal, streaming, named
            "CTVMain" via {$QCAP.CHANNEL.NAME}); dev2 exists but nothing connected; dev3 returns
            HTTP 503 (does not exist on this unit).
        - macro: '{$QCAP.PROBE.RANGE}'
          value: '0,1,2'
          description: |
            Bounded set of /_devN indices to probe (APPS_GET_VIDEO_SOURCE only, once per 30s poll)
            when resolving a type-name entry in {$QCAP.CHANNELS} (e.g. "SDI"/"HDMI") to real dev
            indices. This is deliberately NOT "0-9" - it is the small, already-confirmed-real set
            for this unit, so type-name resolution never turns into a blind full-range scan.
            Verified live 2026-09-18: dev0/dev1/dev2 all respond (dev2 = nothing connected);
            dev3 returns HTTP 503 (does not exist on this unit) - extend this list only after
            confirming a higher index actually responds on a given host.
        - macro: '{$QCAP.SIGNAL.MISSING.TIME}'
          value: 90s
          description: 'How long Signal must stay at 0 (no valid input) before the no-signal trigger fires. Default 90s = 3 polls at the 30s master item interval. Per-channel override: {$QCAP.SIGNAL.MISSING.TIME:<CH>}, e.g. set very high for channels that are intentionally idle.'
        - macro: '{$QCAP.NODATA}'
          value: 5m
          description: 'How long qcap.data must produce no value before the device-unreachable trigger fires.'
        - macro: '{$QCAP.CHANNEL.NAME}'
          value: '{}'
          description: 'Manual per-channel name override: {"<dev index>":"<real channel name>"}, e.g. {"1":"CTVMain"}. The device has no channel-name field that actually holds a value (APPS_GET_VIDEO_SOURCE Name/Group are blank on every channel, confirmed live) so this must be filled in manually from what is actually plugged into each input. Falls back to the auto-detected input type (HDMI/SDI/etc.) when a channel has no entry here. Set as per-host override.'
