        - uuid: 3c64adb53af643c8b0bf1849b0dc0c46
          name: 'vDCM SNMP Trap (trapControlMsgTrap)'
          type: SNMP_TRAP
          key: 'snmptrap[trapControlMsgTrap]'
          history: 7d
          value_type: LOG
          description: |
            Receives all Synamedia vDCM SNMP traps (trapControlMsgTrap / trapControlMsgTrap2).
            Single item for all severities — prevents duplicate alerts when vDCM sends the same fault at multiple severity levels.
            Output: "[ACTIVE] Channel: AlarmText" (RAISED) or "[CLEARED] Channel: AlarmText" (CLEARED).
            Channel name resolution priority: GroupName → UserTag → {$SNMP.IP.MAP} lookup → raw location.
            Noise filtered: PTS Discontinuity, UDP/TS Stream Loss, Input Signal Loss.
            Prerequisites: StartSNMPTrapper=1, SNMPTrapperFile=/var/log/snmptrap/snmptrap.log, host SNMP interface configured.
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  // Parse Synamedia vDCM SNMP trap from /var/log/snmptrap/snmptrap.log.
                  // Single item handles all severities — SINGLE trigger prevents duplicate notifications
                  // when vDCM sends the same fault at multiple severity levels (e.g. sev:2 then sev:5).
                  function extractStringLike(rawValue, fieldName) {
                    var direct = rawValue.match(new RegExp(fieldName + '\\.\\d+\\s+type=\\d+\\s+value=(?:STRING|OCTET STRING):\\s*"([^"]+)"', 'i'));
                    if (direct) return direct[1].trim();
                    var fallback = rawValue.match(new RegExp(fieldName + '\\.\\d+\\s+type=\\d+\\s+value=(?:STRING|OCTET STRING):\\s*([^\\r\\n]+)', 'i'));
                    if (fallback) {
                      var val = fallback[1].trim();
                      if (val === '""') return '';
                      return val.replace(/^"|"$/g, '').trim();
                    }
                    return '';
                  }
                  function extractIntegerLike(rawValue, fieldName) {
                    var match = rawValue.match(new RegExp(fieldName + '\\.\\d+\\s+type=\\d+\\s+value=INTEGER:\\s*(\\d+)', 'i'));
                    if (match) return match[1];
                    return '';
                  }
                  var rawValue = value || '';
                  var mBeh = extractIntegerLike(rawValue, 'msgBehaviour');
                  var mTxt = extractStringLike(rawValue, 'msgText');
                  var mSub = extractStringLike(rawValue, 'msgSubject');
                  var mDet = extractStringLike(rawValue, 'msgDetail');
                  var mStat = extractIntegerLike(rawValue, 'msgStatus');
                  if (!mBeh || !mTxt) return '';
                  // Discard msgBehaviour=0 (instantaneous/transient): no clear counterpart, would latch trigger open
                  if (mBeh === '0') return '';
                  // Noise classification:
                  // ALWAYS_NOISE: inherently meaningless regardless of channel
                  // SLOT_NOISE:   only noise when channel is unknown (empty port slot); real if channel is identified
                  var ALWAYS_NOISE = ['Input Signal Loss', 'No Input Signal'];
                  var SLOT_NOISE   = ['PTS Discontinuity', 'UDP Stream Loss', 'TS Stream Loss'];
                  var trapText = (mTxt || '').replace(/\s+/g, ' ').trim();
                  var trapTextNorm = trapText.replace(/^\s*[^:]+:\s*/i, '').replace(/\s+/g, ' ').trim();
                  var isAlwaysNoise = ALWAYS_NOISE.some(function(n){ return trapTextNorm.indexOf(n) >= 0 || trapText.indexOf(n) >= 0; });
                  var isSlotNoise = SLOT_NOISE.some(function(n){ return trapTextNorm.indexOf(n) >= 0 || trapText.indexOf(n) >= 0; });
                  var isParserNoise = trapText === '' || trapText === 'OK' || trapText.indexOf('ERROR:') === 0 || trapText.indexOf('TypeError') >= 0 || trapText.indexOf('Exception') >= 0 || trapText.indexOf('undefined') >= 0;
                  if (isAlwaysNoise || isParserNoise) return '';
                  // BENIGN_REASON: HLS packager segment-duration variance is a QoS statistic, not a service fault.
                  // Self-clears within seconds; does not affect CDN or player. Filter both raise and cleared to keep counts balanced at zero.
                  var BENIGN_REASON = /Measured\s+segment\s+duration\s+bigger\s+than\s+expected/i;
                  if (mDet && BENIGN_REASON.test(mDet)) return '';
                  // Channel name resolution: GroupName → UserTag → IP map → TS fallback
                  var groupName = '';
                  var sourceText = [mTxt, mSub, mDet].filter(Boolean).join(' ');
                  function resolveUserTag(value) {
                    if (!value) return '';
                    var match = value.match(/UserTag\s+([^,\r\n]+)/i);
                    if (!match) return '';
                    var tag = match[1].trim().replace(/\s*\(.*$/, '').trim();
                    return tag;
                  }
                  // Extract TS/Port/Service up-front so we can use TS as a clean fallback identifier
                  var tsIp = '';
                  var portNo = '';
                  var serviceNo = '';
                  var tsMatch = sourceText.match(/TS(?:\s*[:=])?\s*(\d+\.\d+\.\d+\.\d+:\d+)/i);
                  if (tsMatch) tsIp = tsMatch[1];
                  var portMatch = sourceText.match(/Port\s+(\d+)/i);
                  if (portMatch) portNo = portMatch[1];
                  var serviceMatch = sourceText.match(/Service\s*(\d+)/i);
                  if (serviceMatch) serviceNo = serviceMatch[1];
                  if (mDet) {
                    var gm = mDet.match(/GroupName\s*=\s*([^=;\r\n]+)/i);
                    if (gm) groupName = gm[1].trim();
                  }
                  if (!groupName && mSub) {
                    var gmSub = mSub.match(/GroupName\s*=\s*([^=;\r\n]+)/i);
                    if (gmSub) groupName = gmSub[1].trim();
                  }
                  if (!groupName) {
                    var userTag = resolveUserTag(mSub) || resolveUserTag(mDet) || resolveUserTag(sourceText);
                    if (userTag) groupName = userTag;
                  }
                  if (!groupName && (tsIp || portNo)) {
                    try {
                      var ipMap = JSON.parse('{$SNMP.IP.MAP}');
                      if (tsIp) {
                        groupName = ipMap[tsIp] || ipMap[':'+tsIp.split(':')[1]] || '';
                        if (!groupName && serviceNo) {
                          groupName = ipMap[tsIp + '|' + serviceNo] || ipMap[tsIp + ':' + serviceNo] || ipMap[':' + tsIp.split(':')[1] + '|' + serviceNo] || '';
                        }
                      }
                      if (!groupName && portNo) groupName = ipMap[':'+portNo] || '';
                    } catch(e){}
                  }
                  // Cross-check: drop traps whose channel does not belong to this host.
                  // The Synamedia device stamps SNMP agent-addr incorrectly, so tran2 alarms
                  // arrive tagged as tran1. {$SNMP.IP.MAP} lists channels this host really owns.
                  // Auto-generated placeholder names (Service01, Program 1, etc.) are ignored
                  // when building the owned set to avoid false-positive ownership matches.
                  if (groupName) {
                    try {
                      var m = JSON.parse('{$SNMP.IP.MAP}');
                      var placeholder = /^(service\d+|program(\s*\d+)?|channel\d+|input\d+|output\d+)$/i;
                      var owned = {};
                      Object.keys(m).forEach(function(k){
                        var raw = String(m[k]||'').trim();
                        if (placeholder.test(raw)) return;
                        var v = raw.toLowerCase().replace(/[^a-z0-9]/g,'');
                        if (v.length >= 3) owned[v] = 1;
                      });
                      var norm = groupName.toLowerCase().replace(/[^a-z0-9]/g,'');
                      var match = norm && owned[norm];
                      if (!match && norm) {
                        for (var kk in owned) {
                          if (kk.length >= 4 && (norm.indexOf(kk) === 0 || kk.indexOf(norm) === 0)) { match = 1; break; }
                        }
                      }
                      if (norm && !match && Object.keys(owned).length > 0) return '';
                    } catch(e) {}
                  }
                  // Suppress SLOT_NOISE only when no channel name (empty port slot)
                  if (!groupName && isSlotNoise) return '';
                  // Never expose raw "Board X, Port Y" — operators find it confusing.
                  // Prefer channel name; else use TS as a stable identifier; else port.
                  var identifier = groupName || (tsIp ? 'TS ' + tsIp : (portNo ? 'Port ' + portNo : ''));
                  var base = identifier ? identifier + ': ' + trapText : trapText;
                  // msgBehaviour=1: explicit cleared (other firmware variants)
                  if (mBeh === '1') return '[CLEARED] ' + base;
                  // msgBehaviour=2 + msgStatus=0: real clear event for Synamedia traps.
                  // Do not discard it; otherwise the trigger never recovers even though the device has already cleared the fault.
                  if (mBeh === '2' && mStat === '0') return '[CLEARED] ' + base;
                  return '[ACTIVE] ' + base;
        - uuid: c0f3e46b4e0445408ae5f04740639f17
          name: 'vDCM SNMP channel map (auto-generated from Port 3 output tree)'
          type: DEPENDENT
          key: vdcm.snmp.ip.map
          history: 7d
          value_type: TEXT
          description: |
            Auto-generated JSON map of "TS multicast IP:port" -> service name, consumed by the SNMP trap LLD discovery rules (P1/P2/P3/pkgcfg/pkgpart/tsout use this as master_item) to enumerate real channels. Built by vdcm.data from the Port 3 ({$VDCM.OUTPUT.CARD}) opennode2 output tree: each PG (program group) node's title is the service name (SprtUL/SprtTns/SprtGlf1/SprtGlf2), each child TS_S_P node's title embeds its TS address, e.g. "...TS ID:1(225.1.2.9:1111)". Mirrors the auto mechanism already used on YU-WEI IDC (nm_map field) instead of relying on a manually maintained {$SNMP.IP.MAP} host macro. vdcm_update_ip_map.py (generic, key-based) can still sync this into {$SNMP.IP.MAP} for the trap parser's own display-text fallback, though that fallback is rarely needed since GroupName is already present in msgDetail for real faults.
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.nm_map
          master_item:
            key: vdcm.data
      discovery_rules:
        - uuid: 3bddf9475ad04ebd963da8df470964bc
          name: 'vDCM active alarms (LLD)'
          type: DEPENDENT
          key: vdcm.alarm.discovery
          item_prototypes:
            - uuid: aaed1bdb50504dbca4f8650eab999db8
              name: 'vDCM alarm: {#CH}'
              type: DEPENDENT
              key: 'vdcm.alarm[{#ALARM_ID}]'
              history: 7d
              value_type: CHAR
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - 'var d=JSON.parse(value);var aj=d.alarms_json||[];var id=''{#ALARM_ID}'';for(var i=0;i<aj.length;i++){if(aj[i].id===id)return aj[i].alarm;}return'''';'
              master_item:
                key: vdcm.data
              trigger_prototypes:
                - uuid: eda2f5df70574f4ba97600136bd9dd0f
                  expression: 'count(/Synamedia vDCM Encoder by HTTP API - SPORTCAST IDC/vdcm.alarm[{#ALARM_ID}],#4,"ne","")>=4'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'count(/Synamedia vDCM Encoder by HTTP API - SPORTCAST IDC/vdcm.alarm[{#ALARM_ID}],#6,"eq","")>=6'
                  name: 'vDCM: {#CH}: {ITEM.LASTVALUE}'
                  priority: AVERAGE
                  manual_close: 'YES'
          master_item:
            key: vdcm.data
          lld_macro_paths:
            - lld_macro: '{#ALARM_ID}'
              path: $.id
            - lld_macro: '{#CH}'
              path: $.ch
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.alarms_json
              error_handler: CUSTOM_ERROR
              error_handler_params: '[]'
        - uuid: f2e4b6a8c1d34a87a2f4b6c8d1e3a509
          name: 'vDCM SDI input signal discovery'
          type: DEPENDENT
          key: vdcm.sdi.discovery
          description: 'Discovers SDI input ports from vdcm.sdi.status. Creates one signal item and trigger per SDI port. For SPORTCAST IDC: SDI1(SprtUL), SDI2(SprtTns), SDI3(SprtGlf1), SDI4(SprtGlf2).'
          item_prototypes:
            - uuid: a3c5e7b1d24f4b92a3a5e7d1b4f2c609
              name: '{#SDINAME} ({#SDISVC}) - signal'
              type: DEPENDENT
              key: 'vdcm.sdi.signal[{#SDINAME}]'
              history: 90d
              description: 'SDI input signal status: 1=present, 0=lost. {#SDINAME} is mapped to encoding service {#SDISVC} at port {#SDIPORT}.'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var arr = JSON.parse(value);
                      var name = '{#SDINAME}';
                      for (var i = 0; i < arr.length; i++) {
                          if (arr[i].name === name) { return String(arr[i].signal); }
                      }
                      throw new Error(name + ' not found in vdcm.sdi.status response');
              master_item:
                key: vdcm.sdi.status
              tags:
                - tag: component
                  value: encoder
                - tag: scope
                  value: availability
          trigger_prototypes:
            - uuid: b4d6f8c2e1a34c07b4d6f8c2e1a34b70
              expression: 'min(/Synamedia vDCM Encoder by HTTP API - SPORTCAST IDC/vdcm.sdi.signal[{#SDINAME}],1m)=0 and nodata(/Synamedia vDCM Encoder by HTTP API - SPORTCAST IDC/vdcm.sdi.signal[{#SDINAME}],5m)=0 and last(/Synamedia vDCM Encoder by HTTP API - SPORTCAST IDC/vdcm.device.vdcm_state)="Active"'
              name: '{#SDINAME} ({#SDISVC}): SDI input signal lost'
              priority: HIGH
              description: 'SDI input {#SDINAME} for service {#SDISVC} has had no signal for 1+ minute while vDCM is Active. Check SDI cable and source equipment at {$VDCM.URL}.'
              tags:
                - tag: component
                  value: encoder
                - tag: scope
                  value: availability
          master_item:
            key: vdcm.sdi.status
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var arr = JSON.parse(value);
                  return JSON.stringify(arr.map(function(s) {
                      return { '{#SDINAME}': s.name, '{#SDIPORT}': s.port, '{#SDISVC}': s.service };
                  }));
        - uuid: b7756feaba024c129c5e212ce70de6de
          name: 'vDCM encoding services discovery'
          type: DEPENDENT
          key: vdcm.services.discovery
          description: 'Automatically discovers all S-type encoding services on this vDCM device by parsing the master item vdcm.services.bitrates. Creates one bitrate item and three triggers per discovered service. Works for any number of services regardless of name (EBC, FTV, SprtGlf1, SprtTns, etc.).'
          item_prototypes:
            - uuid: 05faf44d9932411188ffea924a2a4c3b
              name: '{#SVCNAME} - bitrate'
              type: DEPENDENT
              key: 'vdcm.bitrate[{#SVCNAME}]'
              history: 90d
              units: bps
              description: '{#SVCTITLE} encoding service current output bitrate in bps.'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var obj = JSON.parse(value);
                      var svcs = obj.services || obj;
                      var name = '{#SVCNAME}';
                      for (var i = 0; i < svcs.length; i++) {
                          if (svcs[i].name === name) { return String(svcs[i].bps); }
                      }
                      return '0'; // service absent from response = treat as crashed (bps=0)
              master_item:
                key: vdcm.services.bitrates
              tags:
                - tag: component
                  value: encoder
                - tag: service
                  value: '{#SVCNAME}'
          trigger_prototypes:
            - uuid: 5aed7903c9f54158bc6206fbf19237af
              expression: 'min(/Synamedia vDCM Encoder by HTTP API - SPORTCAST IDC/vdcm.bitrate[{#SVCNAME}],3m)<{$VIDEO.BITRATE.MIN} and min(/Synamedia vDCM Encoder by HTTP API - SPORTCAST IDC/vdcm.bitrate[{#SVCNAME}],3m)>0 and last(/Synamedia vDCM Encoder by HTTP API - SPORTCAST IDC/vdcm.device.vdcm_state)="Active"'
              name: '{#SVCNAME}: bitrate below minimum'
              priority: HIGH
              description: 'Service {#SVCNAME} ({#SVCTITLE}) bitrate has been critically below {$VIDEO.BITRATE.MIN} bps for 3+ minutes. Urgent action required.'
              tags:
                - tag: component
                  value: encoder
                - tag: scope
                  value: service
                - tag: service
                  value: '{#SVCNAME}'
            - uuid: 8de5074da7164aa2bea6c59a0c71841b
              expression: 'min(/Synamedia vDCM Encoder by HTTP API - SPORTCAST IDC/vdcm.bitrate[{#SVCNAME}],3m)<{$VIDEO.BITRATE.WARN} and min(/Synamedia vDCM Encoder by HTTP API - SPORTCAST IDC/vdcm.bitrate[{#SVCNAME}],3m)>={$VIDEO.BITRATE.MIN} and last(/Synamedia vDCM Encoder by HTTP API - SPORTCAST IDC/vdcm.device.vdcm_state)="Active"'
              name: '{#SVCNAME}: bitrate is low'
              priority: WARNING
              description: 'Service {#SVCNAME} ({#SVCTITLE}) bitrate has been below {$VIDEO.BITRATE.WARN} bps for 3+ minutes but above critical minimum. Check input source and encoder.'
              tags:
                - tag: component
                  value: encoder
                - tag: scope
                  value: service
                - tag: service
                  value: '{#SVCNAME}'
            - uuid: b5d7e9c1a2f44b28b5d7e9c1a2f44b20
              expression: 'nodata(/Synamedia vDCM Encoder by HTTP API - SPORTCAST IDC/vdcm.bitrate[{#SVCNAME}],5m)=1 and last(/Synamedia vDCM Encoder by HTTP API - SPORTCAST IDC/vdcm.device.vdcm_state)="Active"'
              name: '{#SVCNAME}: service missing from encoding node'
              priority: DISASTER
              description: 'No data collected for service {#SVCNAME} ({#SVCTITLE}) for 5+ minutes while vDCM is Active. The service has disappeared from the Processing Node S-node list — it may have been stopped, crashed, or removed from the configuration. Check {$VDCM.URL} Service Overview.'
              tags:
                - tag: component
                  value: encoder
                - tag: scope
                  value: service
                - tag: service
                  value: '{#SVCNAME}'
            - uuid: 9806650abe5b4544a308e49de5da977b
              expression: 'min(/Synamedia vDCM Encoder by HTTP API - SPORTCAST IDC/vdcm.bitrate[{#SVCNAME}],3m)=0 and nodata(/Synamedia vDCM Encoder by HTTP API - SPORTCAST IDC/vdcm.bitrate[{#SVCNAME}],5m)=0 and last(/Synamedia vDCM Encoder by HTTP API - SPORTCAST IDC/vdcm.device.vdcm_state)="Active"'
              name: '{#SVCNAME}: stream stopped'
              priority: DISASTER
              description: 'Service {#SVCNAME} ({#SVCTITLE}) bitrate has been zero for 3+ minutes and device state is Active — single-channel fault. SPORTCAST encoders run continuously, so bitrate=0 always indicates a fault.'
              tags:
                - tag: component
                  value: encoder
                - tag: scope
                  value: service
                - tag: service
                  value: '{#SVCNAME}'
          graph_prototypes:
            - uuid: 0616dc870ff3488f90002dde4d557727
              name: '{#SVCNAME} - output bitrate'
              graph_items:
                - color: 1A7C11
                  item:
                    host: 'Synamedia vDCM Encoder by HTTP API - SPORTCAST IDC'
                    key: 'vdcm.bitrate[{#SVCNAME}]'
          master_item:
            key: vdcm.services.bitrates
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var obj = JSON.parse(value);
                  var svcs = obj.services || obj;
                  return JSON.stringify(svcs.map(function(s) {
                      return { '{#SVCNAME}': s.name, '{#SVCTITLE}': s.title };
                  }));
        - uuid: a85cdf542b804f389ef0ad0451f73083
          name: 'vDCM SNMP trap P1 (High) discovery'
          type: DEPENDENT
          key: snmp.channel.p1.discovery
          description: 'Tier P1: critical faults on any channel — fires on first event (High).'
