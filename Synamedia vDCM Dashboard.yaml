          widgets:

            # =====================================================================
            # Row 1 (y=0): Active Problems — 全部 Synamedia 主機，依嚴重性排序
            # =====================================================================
            - type: problems
              name: ''
              x: 0
              'y': 0
              width: 36
              height: 5
              fields:
                - type: INTEGER
                  name: show
                  value: '3'
                - type: INTEGER
                  name: show_opdata
                  value: '1'
                - type: INTEGER
                  name: show_tags
                  value: '3'
                - type: INTEGER
                  name: tag_name_format
                  value: '0'
                - type: INTEGER
                  name: show_suppressed
                  value: '0'
                - type: INTEGER
                  name: compact_view
                  value: '0'
                - type: INTEGER
                  name: show_timeline
                  value: '1'
                - type: INTEGER
                  name: sort_triggers
                  value: '16'
                - type: INTEGER
                  name: severities
                  value: '60'
                - type: HOST
                  name: hostids.0
                  value:
                    host: '民視 Synamedia 主機'
                - type: HOST
                  name: hostids.1
                  value:
                    host: '侑瑋 Synamedia 主機 -1'
