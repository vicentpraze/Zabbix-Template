                - type: INTEGER
                  name: show.0
                  value: '1'
                - type: INTEGER
                  name: show.2
                  value: '1'
                - type: INTEGER
                  name: decimal_places
                  value: '0'
                - type: STRING
                  name: description
                  value: '告警數量'
                - type: STRING
                  name: thresholds.0.color
                  value: 4CAF50
                - type: STRING
                  name: thresholds.0.threshold
