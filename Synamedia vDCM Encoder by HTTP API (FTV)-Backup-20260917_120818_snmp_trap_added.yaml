      macros:
        - macro: '{$SNMP.IP.MAP}'
          value: '{}'
          description: 'JSON map of multicast TS IP:port → channel name for SNMP trap alarm display. Used only when trap msgDetail has no GroupName (e.g. CC Error, TS Sync Loss on hardware alarms). Verified via live snmptrap.log that SPORTCAST does NOT need this populated: Bandwidth Exceeded/Packager Input Data Loss/TS Out Loss/Packager Output Partitioning Failure/PCR Not Received all already carry GroupName=SprtUL|SprtTns|SprtGlf1|SprtGlf2 in msgDetail (TS 225.1.2.1-4=SprtUL, .5-8=SprtTns, .9-12=SprtGlf1, .13-16=SprtGlf2). Kept as {} fallback for any future trap type without GroupName/UserTag.'
        - macro: '{$SNMP.TRAP.P1_MIN_COUNT}'
          value: '10'
          description: 'P1 (Disaster) tier: fires after this many net-raise (non-Cleared minus Cleared) traps in {$SNMP.TRAP.P1_WINDOW}. Applies to critical service-loss faults (Service Loss, Service loss at output, Video Input Loss, Audio Input Loss, TS Loss, TS Sync Loss). Calibrated: Synamedia sends update-active every 3-5s during real fault, so 10 traps ≈ 30-50s sustained outage before alerting; short flaps are filtered. Per-channel override via host macro {$SNMP.TRAP.P1_MIN_COUNT:<channel>}, e.g. {$SNMP.TRAP.P1_MIN_COUNT:DayStar}=15 to reduce false alerts on chronic-flap upstream sources.'
        - macro: '{$SNMP.TRAP.P1_WINDOW}'
          value: 5m
          description: 'P1 (Disaster) tier: rolling window used to count non-Cleared traps for critical faults.'
        - macro: '{$SNMP.TRAP.P2_MIN_COUNT}'
          value: '20'
          description: 'P2 (Average) tier: fires after this many non-Cleared traps in {$SNMP.TRAP.P2_WINDOW}. Applies to TS Out Loss, Packager Input Data Loss, EBP out of sync, Bandwidth Exceeded.'
        - macro: '{$SNMP.TRAP.P2_WINDOW}'
          value: 15m
          description: 'P2 (Average) tier: rolling window for sustained faults.'
        - macro: '{$SNMP.TRAP.P3_MIN_COUNT}'
          value: '100'
          description: 'P3 (Warning) tier: fires after this many non-Cleared traps in {$SNMP.TRAP.P3_WINDOW}. Applies to PTS Discontinuity, CC Error, User Selected PCR PID Error, No PCR Present. Calibrated to real-world traffic: observed 24h peak ≈ 58 traps/60min (CTVMainQT PTS Discontinuity); 100 gives ~1.7× headroom above chronic baseline while still catching sustained quality degradation.'
        - macro: '{$SNMP.TRAP.P3_WINDOW}'
          value: 60m
          description: 'P3 (Warning) tier: rolling window for chronic noise.'
        - macro: '{$SNMP.TRAP.PKGCFG.AVG.COUNT}'
          value: '10'
          description: 'Packager Input Stream Config Mismatch escalation Average tier: fires when net raise (count(":") minus cleared) reaches this in {$SNMP.TRAP.PKGCFG.AVG.WINDOW}. ~30s sustained; investigate input stream configuration or upstream encoder settings.'
        - macro: '{$SNMP.TRAP.PKGCFG.AVG.WINDOW}'
          value: 5m
          description: 'Packager Input Stream Config Mismatch escalation Average tier: rolling window for ~30s sustained confirmation.'
        - macro: '{$SNMP.TRAP.PKGCFG.HIGH.COUNT}'
          value: '60'
          description: 'Packager Input Stream Config Mismatch escalation High tier: fires when net raise reaches this in {$SNMP.TRAP.PKGCFG.HIGH.WINDOW}. ~5min chronic; page engineering. Synamedia msgSeverity=2 (Major), so top tier is HIGH, not Disaster.'
        - macro: '{$SNMP.TRAP.PKGCFG.HIGH.WINDOW}'
          value: 10m
          description: 'Packager Input Stream Config Mismatch escalation High tier: rolling window for ~5min chronic confirmation.'
        - macro: '{$SNMP.TRAP.PKGCFG.WARN.COUNT}'
          value: '5'
          description: 'Packager Input Stream Config Mismatch escalation Warning tier: fires when net raise (count(":") minus cleared) reaches this in {$SNMP.TRAP.PKGCFG.WARN.WINDOW}. First-detect signal, watching for confirmation. Cleared traps do not count as raises to avoid false fire on clear-only bursts. Calibrated to OTT buffer tolerance (~15-25s sustained before Warning fires; brief <15s flaps filtered).'
        - macro: '{$SNMP.TRAP.PKGCFG.WARN.WINDOW}'
          value: 2m
          description: 'Packager Input Stream Config Mismatch escalation Warning tier: rolling window for first-detect count.'
        - macro: '{$SNMP.TRAP.PKGPART.AVG.COUNT}'
          value: '10'
          description: 'Packager Output Partitioning Failure escalation Average tier: fires when net raise (count(":") minus cleared) reaches this in {$SNMP.TRAP.PKGPART.AVG.WINDOW}. ~30s sustained; investigate packager or upstream time base.'
        - macro: '{$SNMP.TRAP.PKGPART.AVG.WINDOW}'
          value: 5m
          description: 'Packager Output Partitioning Failure escalation Average tier: rolling window for ~30s sustained confirmation.'
        - macro: '{$SNMP.TRAP.PKGPART.HIGH.COUNT}'
          value: '60'
          description: 'Packager Output Partitioning Failure escalation High tier: fires when net raise reaches this in {$SNMP.TRAP.PKGPART.HIGH.WINDOW}. ~5min chronic; page engineering. Synamedia msgSeverity=2 (Major), so top tier is HIGH, not Disaster.'
        - macro: '{$SNMP.TRAP.PKGPART.HIGH.WINDOW}'
          value: 10m
          description: 'Packager Output Partitioning Failure escalation High tier: rolling window for ~5min chronic confirmation.'
        - macro: '{$SNMP.TRAP.PKGPART.WARN.COUNT}'
          value: '5'
          description: 'Packager Output Partitioning Failure escalation Warning tier: fires when net raise (count(":") minus cleared) reaches this in {$SNMP.TRAP.PKGPART.WARN.WINDOW}. First-detect signal, watching for confirmation. Cleared traps do not count as raises to avoid false fire on clear-only bursts. Calibrated to OTT buffer tolerance (~15-25s sustained before Warning fires; brief <15s flaps filtered).'
        - macro: '{$SNMP.TRAP.PKGPART.WARN.WINDOW}'
          value: 2m
          description: 'Packager Output Partitioning Failure escalation Warning tier: rolling window for first-detect count.'
        - macro: '{$SNMP.TRAP.SILENCE}'
          value: 60m
          description: 'Default cooldown after last matching trap: problem stays open while flapping, only recovers after this long of complete quiet on this (channel × fault). Per-channel override via host macro {$SNMP.TRAP.SILENCE:<channel>}, e.g. {$SNMP.TRAP.SILENCE:DayStar}=2h for chronic upstream flap.'
        - macro: '{$SNMP.TRAP.TSOUT.DISASTER.COUNT}'
          value: '3'
          description: 'TS Out Loss Disaster tier (duration-based): profiles-per-outage threshold. Same semantics as Warning tier: 3 = 3/4 profiles affected = viewer definitely impacted.'
        - macro: '{$SNMP.TRAP.TSOUT.DISASTER.DURATION}'
          value: 5m
          description: 'TS Out Loss Disaster tier (duration-based): fires only if single outage persists longer than this. Represents an extended major outage where viewer buffer has been exhausted for 5+ minutes.'
        - macro: '{$SNMP.TRAP.TSOUT.HIGH.COUNT}'
          value: '3'
          description: 'TS Out Loss High tier (duration-based): profiles-per-outage threshold. Same semantics as Warning tier: 3 = 3/4 profiles affected = viewer definitely impacted.'
        - macro: '{$SNMP.TRAP.TSOUT.HIGH.DURATION}'
          value: 30s
          description: 'TS Out Loss High tier (duration-based): fires only if single outage persists longer than this. Represents a sustained outage worthy of on-call notification.'
        - macro: '{$SNMP.TRAP.TSOUT.WARN.COUNT}'
          value: '3'
          description: 'TS Out Loss Warning tier (duration-based): profiles-per-outage threshold. Synamedia sends 1 trap per output profile per outage (typically 4 profiles). Fire requires this many net raises without cleared for the {$SNMP.TRAP.TSOUT.WARN.DURATION} window. Default 3 = 3/4 profiles affected = viewer likely impacted. Calibrated to detect real single outage exceeding player buffer tolerance.'
        - macro: '{$SNMP.TRAP.TSOUT.WARN.DURATION}'
          value: 12s
          description: 'TS Out Loss Warning tier (duration-based): player buffer tolerance. Fires only if outage persists longer than this. HLS/DASH players buffer ~3 segments (12s at 4s/segment). Outages shorter than this are absorbed by player buffer with zero viewer impact. Adjust to match your player buffer size.'
        - macro: '{$SNMP.TRAP.TSOUT.WARN.CLEAR_GUARD}'
          value: 2m
          description: 'TS Out Loss Warning tier clear-guard window. Suppresses fire when any "[CLEARED]" trap arrived within this window. Prevents false Warning on the Synamedia device alarm refresh cycle (per-channel CLEAR then re-RAISE, same fault text, observed on YU-WEI IDC: gap 8-17s, recurrence irregular ~7.5-24h, no discriminating trap field exists, not a device reboot). Value inherited from YU-WEI IDC pending independent verification against this device’s own snmptrap.log. Default 2m: covers 12s WARN.DURATION + observed max 17s gap + margin.'
        - macro: '{$SNMP.TRAP.TSOUT.HIGH.CLEAR_GUARD}'
          value: 2m
          description: 'TS Out Loss High tier clear-guard window. Suppresses fire when any "[CLEARED]" trap arrived within this window. Prevents false High during the Synamedia refresh cycle (see WARN.CLEAR_GUARD for investigation notes; value inherited from YU-WEI IDC, not yet independently verified for this device). Default 2m: covers 30s HIGH.DURATION + observed max 17s gap + margin.'
        - macro: '{$SNMP.TRAP.TSOUT.DISASTER.CLEAR_GUARD}'
          value: 11m
          description: 'TS Out Loss Disaster tier clear-guard window. Suppresses fire when any "[CLEARED]" trap arrived within this window. Prevents false Disaster on the Synamedia device alarm refresh cycle, a firmware-wide behavior confirmed on YU-WEI IDC (CLEAR->RAISE gap 8-17s, recurrence irregular ~7.5-24h, sysUpTimeInstance never resets so NOT a reboot, no trap field distinguishes it from a genuine transient). Value (11m) inherited from YU-WEI IDC math: guard must exceed the worst-case hot-window end (10m17s at 17s gap), 11m gives 43s margin. Re-verify against this device’s own snmptrap.log once enough history accumulates. Trade-off: real re-fault within ~6min of a legitimate clear is delayed at most 6 minutes at DISASTER tier (still fires WARN/HIGH normally).'
        - macro: '{$VDCM.ALARM.COUNT.MAX}'
          value: '0'
        - macro: '{$VDCM.INPUT.CARDS}'
          value: 'T_I:2:0,T_I:2:1,T_I:2:2,T_I:2:3'
          description: 'Input card xIDs for processing alarm checks. T_I:2:0~T_I:2:3 = Board 2 (vMFP 2), Kona4_1 SDI1-SDI4. These are the four SDI input ports for EBC/TVBS/FTV/EBCF. Note: T_I:2:4 does NOT exist on this device (verified 2026-06-11).'
        - macro: '{$VDCM.OUTPUT.CARD}'
          value: 'T_O:1:2'
          description: 'Output node xID for Port 3 Mgmt (I/O 1, Board 1). T_O:1:2 = Port 3 Mgmt on I/O 1 (0-indexed: Port1=:0, Port3=:2, Port5=:4). Verified 2026-06: contains 8 SRT streams (EBC/TVBS/FTV/EBCF x2 destinations).'
        - macro: '{$VDCM.PASS}'
          type: SECRET_TEXT
          description: 'vDCM web login password. Set per-host as Secret macro.'
        - macro: '{$VDCM.PROC.NODE}'
          value: 'T_T:2:*:*:e0'
          description: 'Processing node xID for /bitrates/processing queries. T_T:2:*:*:e0 = vMFP 2 processing summary node. Verified 2026-06: returns 4 service rows (EBC/TVBS/FTV/EBCF) with cur ~9.8-9.9 Mbps each.'
        - macro: '{$VDCM.SDI.NODES}'
          value: 'T_I:2:0:*:512,T_I:2:1:*:513,T_I:2:2:*:514,T_I:2:3:*:515'
          description: 'Comma-separated SDI stream xID nodes for signal monitoring. SDI1=T_I:2:0:*:512(EBC), SDI2=T_I:2:1:*:513(TVBS), SDI3=T_I:2:2:*:514(FTV), SDI4=T_I:2:3:*:515(EBCF). Verified 2026-06-11 on LiTV_FTV_SRT (61.220.40.194:4431). Set empty string to disable SDI monitoring.'
        - macro: '{$VDCM.SRT.COUNT.MIN}'
          value: '8'
          description: 'Minimum expected number of active SRT output streams on Port 3 Mgmt (T_O:1:2). EBC/TVBS/FTV/EBCF × 2 destinations (218.211.161.8 + 211.21.3.210) = 8 total streams. DISASTER trigger fires if active stream count falls below this value.'
        - macro: '{$VDCM.SVC.COUNT.MIN}'
          value: '4'
          description: 'Minimum expected number of encoding services. DISASTER trigger fires if fewer. EBC/TVBS/FTV/EBCF = 4.'
        - macro: '{$VDCM.URL}'
          value: 'https://61.220.40.194:4431'
          description: 'vDCM web UI base URL, no trailing slash.'
        - macro: '{$VDCM.USER}'
          value: Administrator
          description: 'vDCM web login username'
        - macro: '{$VIDEO.BITRATE.MIN}'
          value: '5000000'
          description: 'Critical threshold in bps. Default 5,000,000 bps (5 Mbps = 50% of 10 Mbps nominal). Trigger fires when encoding is severely degraded but not stopped.'
        - macro: '{$VIDEO.BITRATE.WARN}'
          value: '8000000'
          description: 'Warning threshold in bps. Default 8,000,000 bps (8 Mbps = 80% of 10 Mbps nominal). EBC/EBCF/FTV/TVBS normal range: 9.6-10.3 Mbps.'
        - macro: '{$VIDEO.PROC.BITRATE.WARN}'
          value: '30000000'
          description: 'Warning threshold for total processing bitrate in bps. Default 30,000,000 bps (30 Mbps = ~75% of 39.6 Mbps nominal). Fires HIGH alert when total output drops significantly (one or more services degraded).'
  triggers:
    - uuid: df2b9a9517304702b4a1dc7b3426b9aa
      expression: 'min(/Synamedia vDCM Encoder by HTTP API - FTV/vdcm.proc.bitrate,2m)=0 and nodata(/Synamedia vDCM Encoder by HTTP API - FTV/vdcm.proc.bitrate,5m)=0 and last(/Synamedia vDCM Encoder by HTTP API - FTV/vdcm.device.vdcm_state)="Active"'
      name: 'vDCM: all encoding stopped (total output = 0 bps)'
      priority: DISASTER
      description: 'Total processing bitrate has been 0 bps for 2+ minutes while device is Active. All services have stopped encoding.'
    - uuid: 7129a172b32344008d56e6345149aef1
      expression: 'min(/Synamedia vDCM Encoder by HTTP API - FTV/vdcm.services.count,3m)<{$VDCM.SVC.COUNT.MIN} and nodata(/Synamedia vDCM Encoder by HTTP API - FTV/vdcm.services.count,5m)=0 and last(/Synamedia vDCM Encoder by HTTP API - FTV/vdcm.device.vdcm_state)="Active"'
      name: 'vDCM: fewer encoding services than expected ({ITEM.LASTVALUE}<{$VDCM.SVC.COUNT.MIN})'
      priority: DISASTER
      description: 'Number of active encoding services below {$VDCM.SVC.COUNT.MIN} for 3+ minutes. Expected: EBC, TVBS, FTV, EBCF.'
    - uuid: 8f23f24820e74dff942b6e2c39d33fe1
      expression: 'last(/Synamedia vDCM Encoder by HTTP API - FTV/vdcm.srt.connected)<{$VDCM.SRT.COUNT.MIN} and nodata(/Synamedia vDCM Encoder by HTTP API - FTV/vdcm.srt.connected,5m)=0 and last(/Synamedia vDCM Encoder by HTTP API - FTV/vdcm.device.vdcm_state)="Active"'
      name: 'vDCM: SRT caller disconnected ({ITEM.LASTVALUE}/{$VDCM.SRT.COUNT.MIN} streams connected)'
      priority: DISASTER
      description: 'One or more SRT output streams lost their caller connection (ON flag missing or no Caller IP). Stream title changes from "[SRT] EBC (1) ON ID:1 ... (Caller ...)" to "OFF" or loses Caller info. Expected {$VDCM.SRT.COUNT.MIN} connected callers (218.211.161.8 + 211.21.3.210 × 4 services). Content delivery is interrupted. Check Output > I/O 1 > Port 3 Mgmt at {$VDCM.URL}.'
    - uuid: f24b9d0d8256470f853e1d9431126492
      expression: 'last(/Synamedia vDCM Encoder by HTTP API - FTV/vdcm.srt.count)<{$VDCM.SRT.COUNT.MIN} and nodata(/Synamedia vDCM Encoder by HTTP API - FTV/vdcm.srt.count,5m)=0 and last(/Synamedia vDCM Encoder by HTTP API - FTV/vdcm.device.vdcm_state)="Active"'
      name: 'vDCM: SRT stream count dropped ({ITEM.LASTVALUE} < {$VDCM.SRT.COUNT.MIN})'
      priority: HIGH
      description: 'SRT output stream count in bitrate table dropped below {$VDCM.SRT.COUNT.MIN}. This indicates a stream was removed from vDCM configuration or the bitrate table is not returning all rows. (For caller disconnection, see vdcm.srt.connected trigger.) Check Output > I/O 1 > Port 3 Mgmt at {$VDCM.URL}.'
