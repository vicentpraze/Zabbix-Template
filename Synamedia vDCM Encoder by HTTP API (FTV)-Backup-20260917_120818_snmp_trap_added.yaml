        - uuid: 4fed612db3b44632bb6a295209d8f9fa
          name: 'vDCM SNMP Trap (trapControlMsgTrap)'
          type: SNMP_TRAP
          key: 'snmptrap[trapControlMsgTrap]'
          history: 7d
          value_type: LOG
          description: |
            Receives all Synamedia vDCM SNMP traps (trapControlMsgTrap / trapControlMsgTrap2).
            Single item for all severities — prevents duplicate alerts when vDCM sends the same fault at multiple severity levels.
            Output: "[ACTIVE] Channel: AlarmText" (RAISED) or "[CLEARED] Channel: AlarmText" (CLEARED).
            Channel name resolution priority: GroupName → UserTag → {$SNMP.IP.MAP} lookup → raw location.
            Noise filtered: PTS Discontinuity, UDP/TS Stream Loss, Input Signal Loss.
            Prerequisites: StartSNMPTrapper=1, SNMPTrapperFile=/var/log/snmptrap/snmptrap.log, host SNMP interface configured.
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  // Parse Synamedia vDCM SNMP trap from /var/log/snmptrap/snmptrap.log.
                  // Single item handles all severities — SINGLE trigger prevents duplicate notifications
                  // when vDCM sends the same fault at multiple severity levels (e.g. sev:2 then sev:5).
                  function extractStringLike(rawValue, fieldName) {
                    var direct = rawValue.match(new RegExp(fieldName + '\\.\\d+\\s+type=\\d+\\s+value=(?:STRING|OCTET STRING):\\s*"([^"]+)"', 'i'));
                    if (direct) return direct[1].trim();
                    var fallback = rawValue.match(new RegExp(fieldName + '\\.\\d+\\s+type=\\d+\\s+value=(?:STRING|OCTET STRING):\\s*([^\\r\\n]+)', 'i'));
                    if (fallback) {
                      var val = fallback[1].trim();
                      if (val === '""') return '';
                      return val.replace(/^"|"$/g, '').trim();
                    }
                    return '';
                  }
                  function extractIntegerLike(rawValue, fieldName) {
                    var match = rawValue.match(new RegExp(fieldName + '\\.\\d+\\s+type=\\d+\\s+value=INTEGER:\\s*(\\d+)', 'i'));
                    if (match) return match[1];
                    return '';
                  }
                  var rawValue = value || '';
                  var mBeh = extractIntegerLike(rawValue, 'msgBehaviour');
                  var mTxt = extractStringLike(rawValue, 'msgText');
                  var mSub = extractStringLike(rawValue, 'msgSubject');
                  var mDet = extractStringLike(rawValue, 'msgDetail');
                  var mStat = extractIntegerLike(rawValue, 'msgStatus');
                  if (!mBeh || !mTxt) return '';
                  // Discard msgBehaviour=0 (instantaneous/transient): no clear counterpart, would latch trigger open
                  if (mBeh === '0') return '';
                  // Noise classification:
                  // ALWAYS_NOISE: inherently meaningless regardless of channel
                  // SLOT_NOISE:   only noise when channel is unknown (empty port slot); real if channel is identified
                  var ALWAYS_NOISE = ['Input Signal Loss', 'No Input Signal'];
                  var SLOT_NOISE   = ['PTS Discontinuity', 'UDP Stream Loss', 'TS Stream Loss'];
                  var trapText = (mTxt || '').replace(/\s+/g, ' ').trim();
                  var trapTextNorm = trapText.replace(/^\s*[^:]+:\s*/i, '').replace(/\s+/g, ' ').trim();
                  var isAlwaysNoise = ALWAYS_NOISE.some(function(n){ return trapTextNorm.indexOf(n) >= 0 || trapText.indexOf(n) >= 0; });
                  var isSlotNoise = SLOT_NOISE.some(function(n){ return trapTextNorm.indexOf(n) >= 0 || trapText.indexOf(n) >= 0; });
                  var isParserNoise = trapText === '' || trapText === 'OK' || trapText.indexOf('ERROR:') === 0 || trapText.indexOf('TypeError') >= 0 || trapText.indexOf('Exception') >= 0 || trapText.indexOf('undefined') >= 0;
                  if (isAlwaysNoise || isParserNoise) return '';
                  // BENIGN_REASON: HLS packager segment-duration variance is a QoS statistic, not a service fault.
                  // Self-clears within seconds; does not affect CDN or player. Filter both raise and cleared to keep counts balanced at zero.
                  var BENIGN_REASON = /Measured\s+segment\s+duration\s+bigger\s+than\s+expected/i;
                  if (mDet && BENIGN_REASON.test(mDet)) return '';
                  // Channel name resolution: GroupName → UserTag → IP map → TS fallback
                  var groupName = '';
                  var sourceText = [mTxt, mSub, mDet].filter(Boolean).join(' ');
                  function resolveUserTag(value) {
                    if (!value) return '';
                    var match = value.match(/UserTag\s+([^,\r\n]+)/i);
                    if (!match) return '';
                    var tag = match[1].trim().replace(/\s*\(.*$/, '').trim();
                    return tag;
                  }
                  // Extract TS/Port/Service up-front so we can use TS as a clean fallback identifier
                  var tsIp = '';
                  var portNo = '';
                  var serviceNo = '';
                  var tsMatch = sourceText.match(/TS(?:\s*[:=])?\s*(\d+\.\d+\.\d+\.\d+:\d+)/i);
                  if (tsMatch) tsIp = tsMatch[1];
                  var portMatch = sourceText.match(/Port\s+(\d+)/i);
                  if (portMatch) portNo = portMatch[1];
                  var serviceMatch = sourceText.match(/Service\s*(\d+)/i);
                  if (serviceMatch) serviceNo = serviceMatch[1];
                  if (mDet) {
                    var gm = mDet.match(/GroupName\s*=\s*([^=;\r\n]+)/i);
                    if (gm) groupName = gm[1].trim();
                  }
                  if (!groupName && mSub) {
                    var gmSub = mSub.match(/GroupName\s*=\s*([^=;\r\n]+)/i);
                    if (gmSub) groupName = gmSub[1].trim();
                  }
                  if (!groupName) {
                    var userTag = resolveUserTag(mSub) || resolveUserTag(mDet) || resolveUserTag(sourceText);
                    if (userTag) groupName = userTag;
                  }
                  if (!groupName && (tsIp || portNo)) {
                    try {
                      var ipMap = JSON.parse('{$SNMP.IP.MAP}');
                      if (tsIp) {
                        groupName = ipMap[tsIp] || ipMap[':'+tsIp.split(':')[1]] || '';
                        if (!groupName && serviceNo) {
                          groupName = ipMap[tsIp + '|' + serviceNo] || ipMap[tsIp + ':' + serviceNo] || ipMap[':' + tsIp.split(':')[1] + '|' + serviceNo] || '';
                        }
                      }
                      if (!groupName && portNo) groupName = ipMap[':'+portNo] || '';
                    } catch(e){}
                  }
                  // Cross-check: drop traps whose channel does not belong to this host.
                  // The Synamedia device stamps SNMP agent-addr incorrectly, so tran2 alarms
                  // arrive tagged as tran1. {$SNMP.IP.MAP} lists channels this host really owns.
                  // Auto-generated placeholder names (Service01, Program 1, etc.) are ignored
                  // when building the owned set to avoid false-positive ownership matches.
                  if (groupName) {
                    try {
                      var m = JSON.parse('{$SNMP.IP.MAP}');
                      var placeholder = /^(service\d+|program(\s*\d+)?|channel\d+|input\d+|output\d+)$/i;
                      var owned = {};
                      Object.keys(m).forEach(function(k){
                        var raw = String(m[k]||'').trim();
                        if (placeholder.test(raw)) return;
                        var v = raw.toLowerCase().replace(/[^a-z0-9]/g,'');
                        if (v.length >= 3) owned[v] = 1;
                      });
                      var norm = groupName.toLowerCase().replace(/[^a-z0-9]/g,'');
                      var match = norm && owned[norm];
                      if (!match && norm) {
                        for (var kk in owned) {
                          if (kk.length >= 4 && (norm.indexOf(kk) === 0 || kk.indexOf(norm) === 0)) { match = 1; break; }
                        }
                      }
                      if (norm && !match && Object.keys(owned).length > 0) return '';
                    } catch(e) {}
                  }
                  // Suppress SLOT_NOISE only when no channel name (empty port slot)
                  if (!groupName && isSlotNoise) return '';
                  // Never expose raw "Board X, Port Y" — operators find it confusing.
                  // Prefer channel name; else use TS as a stable identifier; else port.
                  var identifier = groupName || (tsIp ? 'TS ' + tsIp : (portNo ? 'Port ' + portNo : ''));
                  var base = identifier ? identifier + ': ' + trapText : trapText;
                  // msgBehaviour=1: explicit cleared (other firmware variants)
                  if (mBeh === '1') return '[CLEARED] ' + base;
                  // msgBehaviour=2 + msgStatus=0: real clear event for Synamedia traps.
                  // Do not discard it; otherwise the trigger never recovers even though the device has already cleared the fault.
                  if (mBeh === '2' && mStat === '0') return '[CLEARED] ' + base;
                  return '[ACTIVE] ' + base;
        - uuid: 557743afa13e4128841ad578dbb65d80
          name: 'vDCM SNMP channel map (auto-generated from SRT output streams)'
          type: DEPENDENT
          key: vdcm.snmp.ip.map
          history: 7d
          value_type: TEXT
          description: |
            Auto-generated JSON map of ":port" -> service name, consumed by the SNMP trap LLD discovery rules (P1/P2/P3/pkgcfg/pkgpart/tsout use this as master_item) to enumerate real channels (EBC/TVBS/FTV/EBCF). Built by vdcm.data by reusing the already-fetched srt_output.streams list (no extra device query) — each SRT stream's svc name is keyed by its dest_port. Mirrors the auto mechanism used on YU-WEI IDC/SPORTCAST IDC (nm_map field) instead of relying on a manually maintained {$SNMP.IP.MAP} host macro. NOT YET VERIFIED against live traps: this device currently sends 0 SNMP traps to the Zabbix trapper (confirmed via snmptrap.log Sep 17) — check {$VDCM.URL} SNMP trap destination config (StartSNMPTrapper) before relying on this tier.
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.nm_map
          master_item:
            key: vdcm.data
      discovery_rules:
        - uuid: 7373d0c798234821912772ed17befd1b
          name: 'vDCM active alarms (LLD)'
          type: DEPENDENT
          key: vdcm.alarm.discovery
          item_prototypes:
            - uuid: 52080d862ac14441a5d3f93dde9d6039
              name: 'vDCM alarm: {#CH}'
              type: DEPENDENT
              key: 'vdcm.alarm[{#ALARM_ID}]'
              history: 7d
              value_type: CHAR
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - 'var d=JSON.parse(value);var aj=d.alarms_json||[];var id=''{#ALARM_ID}'';for(var i=0;i<aj.length;i++){if(aj[i].id===id)return aj[i].alarm;}return'''';'
              master_item:
                key: vdcm.data
              trigger_prototypes:
                - uuid: cb3daa5f11da45b588cb0e4c7a274b29
                  expression: 'count(/Synamedia vDCM Encoder by HTTP API - FTV/vdcm.alarm[{#ALARM_ID}],#4,"ne","")>=4'
                  recovery_mode: RECOVERY_EXPRESSION
                  recovery_expression: 'count(/Synamedia vDCM Encoder by HTTP API - FTV/vdcm.alarm[{#ALARM_ID}],#6,"eq","")>=6'
                  name: 'vDCM: {#CH}: {ITEM.LASTVALUE}'
                  priority: AVERAGE
                  manual_close: 'YES'
          master_item:
            key: vdcm.data
          lld_macro_paths:
            - lld_macro: '{#ALARM_ID}'
              path: $.id
            - lld_macro: '{#CH}'
              path: $.ch
          preprocessing:
            - type: JSONPATH
              parameters:
                - $.alarms_json
              error_handler: CUSTOM_ERROR
              error_handler_params: '[]'
        - uuid: 4b5c6d7e8f9a4819b44b5c6d7e8f9ab5
          name: 'vDCM SDI input signal discovery'
          type: DEPENDENT
          key: vdcm.sdi.discovery
          description: 'Discovers SDI input ports from vdcm.sdi.status. Creates one signal item and trigger per SDI port. LiTV_FTV_SRT: SDI1(EBC), SDI2(TVBS), SDI3(FTV), SDI4(EBCF).'
          item_prototypes:
            - uuid: 4d32ca8ac414442aa90c5e7f151960cd
              name: '{#SDINAME} ({#SDISVC}) - signal'
              type: DEPENDENT
              key: 'vdcm.sdi.signal[{#SDINAME}]'
              history: 90d
              description: 'SDI input signal status: 1=present, 0=lost. {#SDINAME} maps to service {#SDISVC} at port {#SDIPORT}.'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var arr = JSON.parse(value);
                      var name = '{#SDINAME}';
                      for (var i = 0; i < arr.length; i++) {
                          if (arr[i].name === name) { return String(arr[i].signal); }
                      }
                      throw new Error(name + ' not found in vdcm.sdi.status response');
              master_item:
                key: vdcm.sdi.status
          trigger_prototypes:
            - uuid: aa71effcdb79405da3fed0e7e3bb690e
              expression: 'min(/Synamedia vDCM Encoder by HTTP API - FTV/vdcm.sdi.signal[{#SDINAME}],1m)=0 and nodata(/Synamedia vDCM Encoder by HTTP API - FTV/vdcm.sdi.signal[{#SDINAME}],5m)=0 and last(/Synamedia vDCM Encoder by HTTP API - FTV/vdcm.device.vdcm_state)="Active"'
              name: '{#SDINAME} ({#SDISVC}): SDI input signal lost'
              priority: HIGH
              description: 'SDI input {#SDINAME} for service {#SDISVC} has had no signal for 1+ minute while vDCM is Active. Check SDI cable and source equipment at {$VDCM.URL}.'
          master_item:
            key: vdcm.sdi.status
          preprocessing:
            - type: JAVASCRIPT
              parameters:
                - |
                  var arr = JSON.parse(value);
                  return JSON.stringify(arr.map(function(s) {
                      return { '{#SDINAME}': s.name, '{#SDIPORT}': s.port, '{#SDISVC}': s.service };
                  }));
        - uuid: a1b2c3d4e5f6481987a1b2c3d4e5f697
          name: 'vDCM service bitrate discovery'
          type: DEPENDENT
          key: vdcm.service.discovery
          description: 'Discovers encoding services from vdcm.services.bitrates JSON. Creates per-service bitrate item and three triggers automatically. Services are auto-detected: no template changes needed when channels change.'
          item_prototypes:
            - uuid: b2c3d4e5f6a7481988b2c3d4e5f6a798
              name: '{#SERVICE.NAME} - bitrate'
              type: DEPENDENT
              key: 'vdcm.bitrate[{#SERVICE.NAME}]'
              history: 90d
              units: bps
              description: 'Encoding service {#SERVICE.NAME} current output bitrate in bps.'
              preprocessing:
                - type: JAVASCRIPT
                  parameters:
                    - |
                      var obj = JSON.parse(value);
                      var data = obj.services || obj;
                      var name = '{#SERVICE.NAME}';
                      for (var i = 0; i < data.length; i++) {
                          if (data[i].name === name) { return String(data[i].bps); }
                      }
                      return '0'; // service absent from response = treat as crashed (bps=0)
              master_item:
                key: vdcm.services.bitrates
          trigger_prototypes:
            - uuid: c3d4e5f6a7b8481989c3d4e5f6a7b8a9
              expression: 'min(/Synamedia vDCM Encoder by HTTP API - FTV/vdcm.bitrate[{#SERVICE.NAME}],3m)<{$VIDEO.BITRATE.MIN} and min(/Synamedia vDCM Encoder by HTTP API - FTV/vdcm.bitrate[{#SERVICE.NAME}],3m)>0 and last(/Synamedia vDCM Encoder by HTTP API - FTV/vdcm.device.vdcm_state)="Active"'
              name: '{#SERVICE.NAME}: bitrate below minimum ({ITEM.LASTVALUE})'
              priority: HIGH
              description: 'Service {#SERVICE.NAME} bitrate critically below {$VIDEO.BITRATE.MIN} bps for 3+ minutes.'
            - uuid: d4e5f6a7b8c9481980d4e5f6a7b8c9b0
              expression: 'min(/Synamedia vDCM Encoder by HTTP API - FTV/vdcm.bitrate[{#SERVICE.NAME}],3m)<{$VIDEO.BITRATE.WARN} and min(/Synamedia vDCM Encoder by HTTP API - FTV/vdcm.bitrate[{#SERVICE.NAME}],3m)>{$VIDEO.BITRATE.MIN} and last(/Synamedia vDCM Encoder by HTTP API - FTV/vdcm.device.vdcm_state)="Active"'
