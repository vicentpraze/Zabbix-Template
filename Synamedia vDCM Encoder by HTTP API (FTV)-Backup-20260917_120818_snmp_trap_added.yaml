              description: 'Service {#SERVICE.NAME} has not returned data for 5+ minutes while vDCM is Active. Service may be removed or crashed.'
            - uuid: e5f6a7b8c9d0481981e5f6a7b8c9d0c1
              expression: 'min(/Synamedia vDCM Encoder by HTTP API - FTV/vdcm.bitrate[{#SERVICE.NAME}],2m)=0 and nodata(/Synamedia vDCM Encoder by HTTP API - FTV/vdcm.bitrate[{#SERVICE.NAME}],5m)=0 and last(/Synamedia vDCM Encoder by HTTP API - FTV/vdcm.device.vdcm_state)="Active"'
